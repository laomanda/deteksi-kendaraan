<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="streamlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334E68" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#00A6A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#102A43" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Technical Telemetry Pitch Grid -->
  <g stroke="#334E68" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 8">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    
    <line x1="200" y1="0" x2="200" y2="1200" />
    <line x1="400" y1="0" x2="400" y2="1200" />
    <line x1="600" y1="0" x2="600" y2="1200" />
  </g>

  <!-- Aerodynamic Vehicle Silhouette Flow Lines -->
  <g fill="none" stroke="url(#streamlineGrad)" stroke-width="2" stroke-linecap="round">
    <!-- Wind Tunnel Roofline Trajectory -->
    <path d="M-50 480 C150 480, 240 380, 360 380 C480 380, 600 450, 850 460" />
    <path d="M-50 510 C160 510, 250 410, 370 410 C500 410, 620 480, 850 490" stroke-width="1.5" />
    <path d="M-50 540 C180 540, 270 450, 390 450 C520 450, 640 520, 850 530" />
    <path d="M-50 620 C220 620, 310 560, 420 560 C550 560, 670 610, 850 615" stroke-width="1" />

    <!-- Hood & Shoulder Crest Contour -->
    <path d="M120 720 C240 680, 340 670, 480 670 C620 670, 720 700, 820 740" stroke-width="2.5" />
    <path d="M100 760 C250 730, 360 720, 500 720 C640 720, 740 750, 840 790" />
  </g>

  <!-- Digital HUD Artificial Horizon / Flight Dial Rings -->
  <g fill="none" stroke="#00A6A6" stroke-opacity="0.07" stroke-width="1.5">
    <circle cx="400" cy="550" r="280" />
    <circle cx="400" cy="550" r="240" stroke-dasharray="8 12" />
    <circle cx="400" cy="550" r="180" />
    
    <!-- Horizon Crosshair Nodes -->
    <line x1="120" y1="550" x2="160" y2="550" stroke-width="2" />
    <line x1="640" y1="550" x2="680" y2="550" stroke-width="2" />
    <line x1="400" y1="270" x2="400" y2="310" stroke-width="2" />
    <line x1="400" y1="790" x2="400" y2="830" stroke-width="2" />
  </g>

  <!-- Compass Calibration Markers -->
  <g fill="#334E68" fill-opacity="0.12">
    <rect x="398" y="240" width="4" height="12" />
    <rect x="398" y="848" width="4" height="12" />
    <rect x="98" y="548" width="12" height="4" />
    <rect x="690" y="548" width="12" height="4" />
  </g>
</svg>
