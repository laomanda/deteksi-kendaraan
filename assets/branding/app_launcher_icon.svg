<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193654" />
      <stop offset="100%" stop-color="#102A43" />
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A6A6" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- iOS / Android Squircle Boundary -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgPlate)" stroke="#334E68" stroke-width="6"/>

  <!-- Subtle Inner Bevel -->
  <rect x="28" y="28" width="456" height="456" rx="96" ry="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Centered RideCare Protective Shield Crest -->
  <g transform="matrix(0.85 0 0 0.85 38.4 38.4)">
    <!-- Outer Shield Boundary -->
    <path d="M256 50 L420 106 C420 256 350 380 256 456 C162 380 92 256 92 106 Z" 
          fill="#102A43" stroke="#334E68" stroke-width="10" stroke-linejoin="round"/>

    <!-- Inner Shield Cavity -->
    <path d="M256 78 L396 126 C396 248 336 354 256 424 C176 354 116 248 116 126 Z" 
          fill="#0B1C2D"/>

    <!-- Dynamic Cyan Road Arc -->
    <path d="M130 326 C176 290 214 234 256 164 C298 234 336 290 382 326 C334 316 288 308 256 308 C224 308 178 316 130 326 Z" 
          fill="url(#cyanArc)"/>

    <!-- Pure White Center Emblem Wing -->
    <path d="M256 150 L320 258 L284 258 L256 206 L228 258 L192 258 Z" 
          fill="#FFFFFF"/>

    <!-- Engine Telemetry Pulse Wave (Safe Green) -->
    <path d="M188 360 L224 360 L240 334 L256 386 L272 346 L288 360 L324 360" 
          fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Apex Satellite Indicator Dot -->
    <circle cx="256" cy="144" r="7" fill="#00A6A6" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
</svg>
