<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="coolantTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B53"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="106" rx="44" ry="7" fill="#102A43" fill-opacity="0.12"/>

  <!-- Radiator Heat Exchanger Aluminum Core (Background Grid) -->
  <rect x="22" y="32" width="60" height="66" rx="4" fill="#1E293B" stroke="#334E68" stroke-width="2"/>
  <!-- Cooling Vanes / Microfins -->
  <g stroke="#334E68" stroke-width="1.5">
    <line x1="28" y1="36" x2="28" y2="94"/>
    <line x1="34" y1="36" x2="34" y2="94"/>
    <line x1="40" y1="36" x2="40" y2="94"/>
    <line x1="46" y1="36" x2="46" y2="94"/>
    <line x1="52" y1="36" x2="52" y2="94"/>
    <line x1="58" y1="36" x2="58" y2="94"/>
    <line x1="64" y1="36" x2="64" y2="94"/>
    <line x1="70" y1="36" x2="70" y2="94"/>
    <line x1="76" y1="36" x2="76" y2="94"/>
  </g>

  <!-- Radiator High-Pressure Spring Cap (Winged Pressure Relief Cap) -->
  <g transform="translate(38, 20)">
    <rect x="-8" y="4" width="28" height="8" rx="2" fill="#F59E0B" stroke="#102A43" stroke-width="1.5"/>
    <ellipse cx="6" cy="4" rx="16" ry="4" fill="#00A6A6"/>
    <line x1="-6" y1="4" x2="18" y2="4" stroke="#F7F5EF" stroke-width="1"/>
  </g>

  <!-- Translucent Coolant Expansion Reservoir Bottle (Foreground Right) -->
  <g transform="translate(68, 44)">
    <!-- Reservoir Casing -->
    <rect x="0" y="0" width="34" height="54" rx="8" fill="url(#coolantTank)" stroke="#00A6A6" stroke-width="2"/>
    <!-- Translucent Reservoir Fluid Fill Level (Electric Cyan Coolant) -->
    <rect x="3" y="18" width="28" height="32" rx="4" fill="#00A6A6" fill-opacity="0.8"/>
    <!-- Min / Max Level Calibration Markings -->
    <line x1="6" y1="24" x2="14" y2="24" stroke="#F7F5EF" stroke-width="1.5"/>
    <text x="16" y="26" fill="#F7F5EF" font-family="sans-serif" font-size="6" font-weight="700">MAX</text>
    <line x1="6" y1="38" x2="14" y2="38" stroke="#F7F5EF" stroke-width="1.5"/>
    <text x="16" y="40" fill="#F7F5EF" font-family="sans-serif" font-size="6" font-weight="700">MIN</text>
    <!-- Reservoir Cap -->
    <rect x="8" y="-6" width="18" height="8" rx="3" fill="#102A43" stroke="#334E68" stroke-width="1.5"/>
    <!-- Connecting Coolant Overflow Hose -->
    <path d="M12 -2 C8 -14, -20 -14, -24 0" fill="none" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Thermometer Temperature Badge -->
  <g transform="translate(30, 72)">
    <circle cx="8" cy="8" r="7" fill="#16A34A" stroke="#102A43" stroke-width="1.5"/>
    <path d="M8 4 L8 9 M8 11 L8 11.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
