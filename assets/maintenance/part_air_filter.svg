<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="filterRubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3851"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="106" rx="46" ry="8" fill="#102A43" fill-opacity="0.12"/>

  <!-- Isometric Box / Cylindrical Air Filter Body -->
  <!-- Heavy-Duty Protective Rubber Outer Flange / Gasket Frame -->
  <path d="M20 40 L70 24 L104 44 L54 60 Z" fill="#243B53" stroke="#334E68" stroke-width="2"/>
  <path d="M20 40 L54 60 L54 94 L20 74 Z" fill="url(#filterRubber)" stroke="#334E68" stroke-width="2"/>
  <path d="M54 60 L104 44 L104 78 L54 94 Z" fill="#0D1F33" stroke="#334E68" stroke-width="2"/>

  <!-- High-Flow Pleated Filter Paper Mesh (Zigzag Accordion Intake Vanes) -->
  <!-- Left Face Pleats (Amber / Viscous Cotton Mesh) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="26" y1="46" x2="26" y2="76"/>
    <line x1="31" y1="49" x2="31" y2="79"/>
    <line x1="36" y1="52" x2="36" y2="82"/>
    <line x1="41" y1="54" x2="41" y2="85"/>
    <line x1="46" y1="57" x2="46" y2="88"/>
    <line x1="50" y1="59" x2="50" y2="91"/>
  </g>

  <!-- Right Face Pleats -->
  <g stroke="#D97706" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="58" x2="60" y2="91"/>
    <line x1="66" y1="55" x2="66" y2="88"/>
    <line x1="72" y1="53" x2="72" y2="85"/>
    <line x1="78" y1="51" x2="78" y2="83"/>
    <line x1="84" y1="49" x2="84" y2="81"/>
    <line x1="90" y1="47" x2="90" y2="79"/>
    <line x1="96" y1="45" x2="96" y2="77"/>
  </g>

  <!-- Top Protective Reinforced Steel Wire Mesh Grid -->
  <g stroke="#00A6A6" stroke-width="1.5" stroke-opacity="0.7">
    <line x1="32" y1="36" x2="66" y2="52"/>
    <line x1="44" y1="32" x2="78" y2="48"/>
    <line x1="56" y1="28" x2="90" y2="44"/>
    
    <line x1="44" y1="48" x2="78" y2="32"/>
    <line x1="32" y1="44" x2="66" y2="28"/>
    <line x1="56" y1="52" x2="90" y2="36"/>
  </g>

  <!-- High-Flow Airflow Arrow Node -->
  <g transform="translate(60, 14)">
    <circle cx="0" cy="0" r="8" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
    <path d="M-3 -2 L0 2 L3 -2" fill="none" stroke="#F7F5EF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
