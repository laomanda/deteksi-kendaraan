<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rotorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627D98"/>
      <stop offset="100%" stop-color="#334E68"/>
    </linearGradient>
    <linearGradient id="caliperCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="106" rx="44" ry="7" fill="#102A43" fill-opacity="0.12"/>

  <!-- High-Performance Drilled Brake Disc Rotor -->
  <g transform="translate(60, 60)">
    <!-- Outer Friction Ring -->
    <circle cx="0" cy="0" r="44" fill="url(#rotorSteel)" stroke="#243B53" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="#102A43"/>

    <!-- Cross-Drilled Ventilation Holes (Radial Patterns) -->
    <!-- Pattern Rings -->
    <circle cx="0" cy="-37" r="1.5" fill="#102A43"/>
    <circle cx="14" cy="-34" r="1.5" fill="#102A43"/>
    <circle cx="26" cy="-26" r="1.5" fill="#102A43"/>
    <circle cx="34" cy="-14" r="1.5" fill="#102A43"/>
    <circle cx="37" cy="0" r="1.5" fill="#102A43"/>
    <circle cx="34" cy="14" r="1.5" fill="#102A43"/>
    <circle cx="26" cy="26" r="1.5" fill="#102A43"/>
    <circle cx="14" cy="34" r="1.5" fill="#102A43"/>
    <circle cx="0" cy="37" r="1.5" fill="#102A43"/>
    <circle cx="-14" cy="34" r="1.5" fill="#102A43"/>
    <circle cx="-26" cy="26" r="1.5" fill="#102A43"/>
    <circle cx="-34" cy="14" r="1.5" fill="#102A43"/>
    <circle cx="-37" cy="0" r="1.5" fill="#102A43"/>
    <circle cx="-34" cy="-14" r="1.5" fill="#102A43"/>
    <circle cx="-26" cy="-26" r="1.5" fill="#102A43"/>
    <circle cx="-14" cy="-34" r="1.5" fill="#102A43"/>

    <!-- Inner Floating Rotor Carrier Carrier Carrier -->
    <circle cx="0" cy="0" r="22" fill="#243B53" stroke="#486581" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#102A43"/>
    <!-- 5 Wheel Hub Stud Holes -->
    <circle cx="0" cy="-15" r="2.5" fill="#F7F5EF"/>
    <circle cx="14" cy="-5" r="2.5" fill="#F7F5EF"/>
    <circle cx="9" cy="12" r="2.5" fill="#F7F5EF"/>
    <circle cx="-9" cy="12" r="2.5" fill="#F7F5EF"/>
    <circle cx="-14" cy="-5" r="2.5" fill="#F7F5EF"/>
  </g>

  <!-- Heavy-Duty Hydraulic Twin-Piston Brake Caliper (Top-Right Angle) -->
  <g transform="translate(68, 20)">
    <!-- Caliper Body Shell in Electric Cyan -->
    <path d="M0 8 L32 0 L42 34 L10 42 Z" fill="url(#caliperCyan)" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/>
    <!-- Caliper Mounting Bolts -->
    <circle cx="8" cy="14" r="3" fill="#102A43" stroke="#F7F5EF" stroke-width="1"/>
    <circle cx="34" cy="8" r="3" fill="#102A43" stroke="#F7F5EF" stroke-width="1"/>

    <!-- Twin Piston Cylinders Detail -->
    <rect x="12" y="18" width="10" height="18" rx="2" fill="#102A43"/>
    <rect x="24" y="16" width="10" height="18" rx="2" fill="#102A43"/>

    <!-- Hydraulic Brake Bleeder Valve -->
    <rect x="36" y="2" width="5" height="8" rx="1" fill="#F59E0B"/>

    <!-- High-Friction Brake Pad Indicator Lip -->
    <path d="M-4 22 L8 20 L6 36 L-6 38 Z" fill="#DC2626"/>
  </g>
</svg>
