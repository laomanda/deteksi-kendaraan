<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="oilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <!-- Technical Ambient Shadow -->
  <ellipse cx="60" cy="106" rx="42" ry="7" fill="#102A43" fill-opacity="0.12"/>

  <!-- Isometric Oil Bottle Base & Body -->
  <!-- Back Wall -->
  <path d="M36 40 L84 40 L92 98 L28 98 Z" fill="#0D1F33"/>

  <!-- Bottle Isometric Top Bevel & Handle Cutout -->
  <path d="M36 40 L60 26 L84 40 L80 98 L40 98 Z" fill="url(#oilBody)" stroke="#334E68" stroke-width="2" stroke-linejoin="round"/>
  <!-- Integrated Handle Hole -->
  <rect x="62" y="44" width="14" height="28" rx="7" fill="#F7F5EF" stroke="#334E68" stroke-width="1.5"/>

  <!-- Threaded Bottle Cap -->
  <rect x="38" y="18" width="18" height="10" rx="3" fill="#00A6A6" stroke="#102A43" stroke-width="1.5"/>
  <line x1="42" y1="21" x2="52" y2="21" stroke="#F7F5EF" stroke-width="1.5"/>

  <!-- Clear Level Gauge Stripe (Side Window) -->
  <rect x="34" y="44" width="4" height="48" rx="2" fill="#F59E0B"/>
  <line x1="32" y1="56" x2="38" y2="56" stroke="#334E68" stroke-width="1"/>
  <line x1="32" y1="68" x2="38" y2="68" stroke="#334E68" stroke-width="1"/>
  <line x1="32" y1="80" x2="38" y2="80" stroke="#334E68" stroke-width="1"/>

  <!-- Front Label Plate -->
  <rect x="42" y="52" width="34" height="38" rx="4" fill="#243B53" stroke="#334E68" stroke-width="1"/>
  
  <!-- Golden/Amber Oil Drop Emblem with Cyan Pulse -->
  <path d="M59 60 C59 60, 67 70, 67 74 C67 78.4, 63.4 82, 59 82 C54.6 82, 51 78.4, 51 74 C51 70, 59 60, 59 60 Z" 
        fill="#F59E0B" stroke="#00A6A6" stroke-width="1.5"/>
  <circle cx="56" cy="74" r="2" fill="#F7F5EF"/>

  <text x="59" y="88" fill="#F7F5EF" font-family="monospace" font-size="6" font-weight="700" text-anchor="middle">10W-40</text>
</svg>
