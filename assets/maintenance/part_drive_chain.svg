<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sprocketSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486581"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="106" rx="44" ry="7" fill="#102A43" fill-opacity="0.12"/>

  <!-- Precision Cut Drive Sprocket Wheel (Toothed) -->
  <g transform="translate(60, 60)">
    <!-- Outer Gear Teeth Profile -->
    <circle cx="0" cy="0" r="42" fill="url(#sprocketSteel)" stroke="#334E68" stroke-width="2"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#102A43" stroke-width="4" stroke-dasharray="6 5"/>
    
    <!-- Lightening Cutout Windows (Weight Reduction) -->
    <circle cx="0" cy="0" r="28" fill="#102A43"/>
    <circle cx="0" cy="-16" r="6" fill="#F7F5EF"/>
    <circle cx="14" cy="-8" r="6" fill="#F7F5EF"/>
    <circle cx="14" cy="10" r="6" fill="#F7F5EF"/>
    <circle cx="0" cy="18" r="6" fill="#F7F5EF"/>
    <circle cx="-14" cy="10" r="6" fill="#F7F5EF"/>
    <circle cx="-14" cy="-8" r="6" fill="#F7F5EF"/>

    <!-- Center Mounting Hub & Drive Flange Bolts -->
    <circle cx="0" cy="0" r="12" fill="#334E68" stroke="#00A6A6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#00A6A6"/>
  </g>

  <!-- Heavy Duty Roller Chain Links Wrapping the Top & Right Arc -->
  <!-- Link 1 -->
  <rect x="22" y="16" width="18" height="10" rx="5" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
  <circle cx="27" cy="21" r="2.5" fill="#F59E0B"/>
  <circle cx="35" cy="21" r="2.5" fill="#F59E0B"/>

  <!-- Link 2 -->
  <rect x="36" y="14" width="18" height="10" rx="5" fill="#243B53" stroke="#334E68" stroke-width="1.5"/>
  <circle cx="41" cy="19" r="2.5" fill="#F7F5EF"/>
  <circle cx="49" cy="19" r="2.5" fill="#F7F5EF"/>

  <!-- Link 3 -->
  <rect x="50" y="13" width="18" height="10" rx="5" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
  <circle cx="55" cy="18" r="2.5" fill="#F59E0B"/>
  <circle cx="63" cy="18" r="2.5" fill="#F59E0B"/>

  <!-- Link 4 -->
  <rect x="65" y="14" width="18" height="10" rx="5" fill="#243B53" stroke="#334E68" stroke-width="1.5"/>
  <circle cx="70" cy="19" r="2.5" fill="#F7F5EF"/>
  <circle cx="78" cy="19" r="2.5" fill="#F7F5EF"/>

  <!-- Link 5 (Angled) -->
  <g transform="rotate(25 88 28)">
    <rect x="79" y="23" width="18" height="10" rx="5" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
    <circle cx="84" cy="28" r="2.5" fill="#F59E0B"/>
    <circle cx="92" cy="28" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Link 6 (Side Downward Run) -->
  <g transform="rotate(65 102 54)">
    <rect x="93" y="49" width="18" height="10" rx="5" fill="#243B53" stroke="#334E68" stroke-width="1.5"/>
    <circle cx="98" cy="54" r="2.5" fill="#F7F5EF"/>
    <circle cx="106" cy="54" r="2.5" fill="#F7F5EF"/>
  </g>
</svg>
