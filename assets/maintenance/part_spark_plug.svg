<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="plugSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627D98"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="106" rx="36" ry="6" fill="#102A43" fill-opacity="0.12"/>

  <!-- Tilted Isometric High-Performance Spark Plug (35 degree tilt) -->
  <g transform="rotate(-35 60 60)">
    <!-- Terminal Stud Nut (Top) -->
    <rect x="56" y="8" width="8" height="10" rx="2" fill="#627D98" stroke="#102A43" stroke-width="1.5"/>

    <!-- White Alumina Ceramic Insulator Body with Corrugation Ribs -->
    <rect x="53" y="18" width="14" height="34" rx="3" fill="#F7F5EF" stroke="#334E68" stroke-width="1.5"/>
    <!-- 3 Anti-Flashover Glazed Ribs -->
    <rect x="51" y="24" width="18" height="3" rx="1.5" fill="#E2E8F0" stroke="#334E68" stroke-width="1"/>
    <rect x="51" y="30" width="18" height="3" rx="1.5" fill="#E2E8F0" stroke="#334E68" stroke-width="1"/>
    <rect x="51" y="36" width="18" height="3" rx="1.5" fill="#E2E8F0" stroke="#334E68" stroke-width="1"/>

    <!-- Hex Nut Shell (For Socket Wrench) -->
    <path d="M48 52 L72 52 L76 66 L44 66 Z" fill="url(#plugSteel)" stroke="#102A43" stroke-width="2"/>
    <line x1="56" y1="52" x2="54" y2="66" stroke="#486581" stroke-width="1.5"/>
    <line x1="64" y1="52" x2="66" y2="66" stroke="#486581" stroke-width="1.5"/>

    <!-- Gasket Sealing Crush Washer -->
    <rect x="49" y="66" width="22" height="4" rx="1" fill="#F59E0B" stroke="#102A43" stroke-width="1"/>

    <!-- Threaded Metal Cylinder Body -->
    <rect x="52" y="70" width="16" height="26" fill="url(#plugSteel)" stroke="#102A43" stroke-width="1.5"/>
    <!-- Precision Pitch Threads -->
    <line x1="50" y1="74" x2="70" y2="74" stroke="#102A43" stroke-width="2"/>
    <line x1="50" y1="78" x2="70" y2="78" stroke="#102A43" stroke-width="2"/>
    <line x1="50" y1="82" x2="70" y2="82" stroke="#102A43" stroke-width="2"/>
    <line x1="50" y1="86" x2="70" y2="86" stroke="#102A43" stroke-width="2"/>
    <line x1="50" y1="90" x2="70" y2="90" stroke="#102A43" stroke-width="2"/>

    <!-- Center Electrode (Fine-Wire Iridium Needle Tip) -->
    <rect x="58" y="96" width="4" height="8" rx="1" fill="#CBD5E1"/>
    <circle cx="60" cy="104" r="1.5" fill="#00A6A6"/>

    <!-- Curved Ground Electrode with Spark Gap -->
    <path d="M52 96 L52 108 L62 108" fill="none" stroke="#627D98" stroke-width="2.5" stroke-linecap="round"/>

    <!-- High-Energy Spark Discharge Arc (Electric Cyan) -->
    <path d="M58 104 L60 102 L59 107 L61 105" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
