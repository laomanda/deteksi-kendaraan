<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Card Subtle Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#162E47"/>
      <stop offset="60%"  stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1C2D"/>
    </linearGradient>

    <!-- Active Route Glowing Gradient -->
    <linearGradient id="routeLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#16A34A"/>
      <stop offset="40%"  stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. AMBIENT SHADOW BASE                                         -->
  <!-- ============================================================== -->
  <rect x="76" y="78" width="360" height="360" rx="48" fill="#102A43" fill-opacity="0.16"/>

  <!-- ============================================================== -->
  <!-- 2. TELEMETRY COMPONENT CARD (Clean Automotive Surface)         -->
  <!-- ============================================================== -->
  <!-- Outer Slate Bezel -->
  <rect x="64" y="64" width="384" height="384" rx="44"
        fill="url(#cardGrad)" stroke="#334E68" stroke-width="4"/>

  <!-- Inner Dark Telemetry Field -->
  <rect x="78" y="78" width="356" height="356" rx="32"
        fill="#081624" stroke="#1A3047" stroke-width="2"/>

  <!-- ============================================================== -->
  <!-- 3. GPS TELEMETRY GRID & COORDINATE CROSSHAIRS                  -->
  <!-- ============================================================== -->
  <!-- Latitude Grid Lines -->
  <line x1="100" y1="170" x2="412" y2="170" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="100" y1="256" x2="412" y2="256" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="100" y1="342" x2="412" y2="342" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Longitude Grid Lines -->
  <line x1="170" y1="100" x2="170" y2="412" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="256" y1="100" x2="256" y2="412" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="342" y1="100" x2="342" y2="412" stroke="#13263A" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Grid Coordinate Cross Points (+) -->
  <g stroke="#223C56" stroke-width="2">
    <line x1="164" y1="170" x2="176" y2="170"/><line x1="170" y1="164" x2="170" y2="176"/>
    <line x1="250" y1="170" x2="262" y2="170"/><line x1="256" y1="164" x2="256" y2="176"/>
    <line x1="336" y1="170" x2="348" y2="170"/><line x1="342" y1="164" x2="342" y2="176"/>

    <line x1="164" y1="256" x2="176" y2="256"/><line x1="170" y1="250" x2="170" y2="262"/>
    <line x1="250" y1="256" x2="262" y2="256"/><line x1="256" y1="250" x2="256" y2="262"/>
    <line x1="336" y1="256" x2="348" y2="256"/><line x1="342" y1="250" x2="342" y2="262"/>

    <line x1="164" y1="342" x2="176" y2="342"/><line x1="170" y1="336" x2="170" y2="348"/>
    <line x1="250" y1="342" x2="262" y2="342"/><line x1="256" y1="336" x2="256" y2="348"/>
    <line x1="336" y1="342" x2="348" y2="342"/><line x1="342" y1="336" x2="342" y2="348"/>
  </g>

  <!-- ============================================================== -->
  <!-- 4. DISTANCE MEASUREMENT SCALE BAR (Top Displacement Indicator) -->
  <!-- ============================================================== -->
  <!-- Top Delta Scale Line -->
  <line x1="138" y1="116" x2="378" y2="116" stroke="#243B53" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Endpoint Bracket -->
  <line x1="138" y1="108" x2="138" y2="124" stroke="#486581" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Endpoint Bracket -->
  <line x1="378" y1="108" x2="378" y2="124" stroke="#486581" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Distance Measurement Center Pill Indicator -->
  <rect x="226" y="106" width="60" height="20" rx="10"
        fill="#102A43" stroke="#334E68" stroke-width="1.5"/>
  <line x1="238" y1="116" x2="254" y2="116" stroke="#829AB1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="260" y1="116" x2="274" y2="116" stroke="#00A6A6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 5. PRIMARY: VEHICLE ROUTE TRAJECTORY (Dynamic Spline Vector)   -->
  <!-- ============================================================== -->
  <!-- Elevation Drop Lines to Spatial Plane -->
  <line x1="138" y1="340" x2="138" y2="364" stroke="#16283A" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="262" y1="248" x2="262" y2="290" stroke="#16283A" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="378" y1="162" x2="378" y2="210" stroke="#16283A" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Road Base Track Underlay -->
  <path d="M 138 340
           C 174 236, 222 278, 266 248
           C 308 218, 338 172, 378 162"
        fill="none" stroke="#040B12" stroke-width="22" stroke-linecap="round"/>

  <!-- Active Route Glow Aura (Cyan) -->
  <path d="M 138 340
           C 174 236, 222 278, 266 248
           C 308 218, 338 172, 378 162"
        fill="none" stroke="#00A6A6" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round"/>

  <!-- Main Active Trajectory Vector Path -->
  <path d="M 138 340
           C 174 236, 222 278, 266 248
           C 308 218, 338 172, 378 162"
        fill="none" stroke="url(#routeLineGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Direction Chevron Markers on Path -->
  <path d="M 200 264 L 208 258 L 202 252" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 322 202 L 330 196 L 324 190" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============================================================== -->
  <!-- 6. SECONDARY: WAYPOINTS & ACTIVE VEHICLE GPS PIN               -->
  <!-- ============================================================== -->
  <!-- 1. Origin / Start Node (Green Success) -->
  <circle cx="138" cy="340" r="19" fill="#16A34A" stroke="#102A43" stroke-width="4"/>
  <circle cx="138" cy="340" r="7.5" fill="#FFFFFF"/>

  <!-- 2. Intermediate Waypoint Node -->
  <circle cx="266" cy="248" r="12" fill="#1E3851" stroke="#334E68" stroke-width="3"/>
  <circle cx="266" cy="248" r="4.5" fill="#9FB3C8"/>

  <!-- 3. Current Vehicle Destination Node (Active Cyan GPS Beacon) -->
  <!-- Outer Pulse Wave -->
  <circle cx="378" cy="162" r="30" fill="none" stroke="#00A6A6" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.5"/>
  <circle cx="378" cy="162" r="20" fill="#00A6A6" stroke="#102A43" stroke-width="4"/>
  <circle cx="378" cy="162" r="7.5" fill="#FFFFFF"/>

  <!-- ============================================================== -->
  <!-- 7. BOTTOM TELEMETRY STATUS PILL (Subtle System Accent)         -->
  <!-- ============================================================== -->
  <rect x="196" y="380" width="120" height="18" rx="9"
        fill="#102A43" stroke="#243B53" stroke-width="1.5"/>
  <line x1="212" y1="389" x2="236" y2="389" stroke="#627D98" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="244" y1="389" x2="276" y2="389" stroke="#829AB1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="292" cy="389" r="3" fill="#00A6A6"/>
</svg>
