<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 51.2) scale(1.28)">
    <!-- Technical Horizon Arc -->
    <ellipse cx="200" cy="270" rx="160" ry="14" fill="#102A43" fill-opacity="0.10"/>

    <!-- Center Stage: Intelligent Service Schedule Tablet Card -->
    <g transform="translate(110, 60)">
      <rect x="0" y="0" width="180" height="200" rx="16" fill="url(#cardGrad)" stroke="#334E68" stroke-width="2.5"/>
      
      <!-- Header: Space Grotesk Mileage Counter -->
      <rect x="14" y="14" width="152" height="42" rx="8" fill="#0B1C2D" stroke="#00A6A6" stroke-width="1.5"/>
      <text x="24" y="32" fill="#627D98" font-family="sans-serif" font-size="8" font-weight="700">ODOMETER SERVIS</text>
      <text x="24" y="48" fill="#F7F5EF" font-family="monospace" font-size="14" font-weight="700">14.250 KM</text>
      
      <!-- Status Chip Warning Amber (Near Service) -->
      <rect x="110" y="26" width="48" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
      <text x="134" y="38" fill="#F59E0B" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">SEGERA</text>

      <!-- Component Schedule Checklist Rows -->
      <!-- Row 1: Engine Oil -->
      <g transform="translate(14, 68)">
        <rect x="0" y="0" width="152" height="34" rx="6" fill="#102A43" stroke="#334E68" stroke-width="1"/>
        <circle cx="16" cy="17" r="8" fill="#F59E0B" fill-opacity="0.2"/>
        <circle cx="16" cy="17" r="4" fill="#F59E0B"/>
        <text x="32" y="15" fill="#F7F5EF" font-family="sans-serif" font-size="9" font-weight="700">Oli Mesin Matic</text>
        <text x="32" y="26" fill="#00A6A6" font-family="monospace" font-size="7.5" font-weight="600">Sisa 350 KM (2 Minggu)</text>
      </g>

      <!-- Row 2: CVT Belt & Roller -->
      <g transform="translate(14, 110)">
        <rect x="0" y="0" width="152" height="34" rx="6" fill="#102A43" stroke="#334E68" stroke-width="1"/>
        <circle cx="16" cy="17" r="8" fill="#16A34A" fill-opacity="0.2"/>
        <circle cx="16" cy="17" r="4" fill="#16A34A"/>
        <text x="32" y="15" fill="#F7F5EF" font-family="sans-serif" font-size="9" font-weight="700">Sabuk CVT &amp; Roller</text>
        <text x="32" y="26" fill="#627D98" font-family="monospace" font-size="7.5" font-weight="600">Sisa 4.750 KM (Optimal)</text>
      </g>

      <!-- Bottom Action Pill: Jadwalkan Perawatan -->
      <g transform="translate(14, 154)">
        <rect x="0" y="0" width="152" height="30" rx="15" fill="#00A6A6"/>
        <text x="76" y="19" fill="#102A43" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">
          CATAT SERVIS SEKARANG
        </text>
      </g>
    </g>

    <!-- Floating 2.5D Satellites (Modular Parts Around the Tablet) -->
    <!-- Floating Oil Bottle (Top Left) -->
    <g transform="translate(48, 50) scale(0.65)">
      <circle cx="40" cy="40" r="32" fill="#102A43" stroke="#00A6A6" stroke-width="2"/>
      <rect x="28" y="24" width="24" height="32" rx="4" fill="#F59E0B"/>
      <rect x="34" y="18" width="12" height="8" rx="2" fill="#F7F5EF"/>
    </g>

    <!-- Floating Brake Rotor (Top Right) -->
    <g transform="translate(304, 44) scale(0.65)">
      <circle cx="40" cy="40" r="34" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <circle cx="40" cy="40" r="26" fill="none" stroke="#627D98" stroke-width="6" stroke-dasharray="8 4"/>
      <rect x="44" y="22" width="16" height="22" rx="4" fill="#00A6A6"/>
    </g>

    <!-- Floating Battery (Bottom Right) -->
    <g transform="translate(300, 180) scale(0.65)">
      <circle cx="40" cy="40" r="32" fill="#102A43" stroke="#16A34A" stroke-width="2"/>
      <rect x="24" y="26" width="32" height="28" rx="3" fill="#243B53" stroke="#16A34A" stroke-width="1.5"/>
      <rect x="28" y="20" width="6" height="6" fill="#334E68"/>
      <rect x="46" y="20" width="6" height="6" fill="#DC2626"/>
    </g>

    <!-- Floating Spark Plug (Bottom Left) -->
    <g transform="translate(44, 180) scale(0.65)">
      <circle cx="40" cy="40" r="32" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <rect x="36" y="16" width="8" height="48" rx="2" fill="#F7F5EF"/>
      <rect x="33" y="32" width="14" height="12" rx="2" fill="#486581"/>
      <circle cx="40" cy="62" r="2" fill="#00A6A6"/>
    </g>
  </g>
</svg>
