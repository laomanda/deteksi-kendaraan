<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <!-- Soft Ambient Ground Plane -->
  <ellipse cx="200" cy="265" rx="140" ry="10" fill="#E2E8F0" fill-opacity="0.6"/>

  <!-- Rear Wheel Assembly -->
  <g id="rear-wheel">
    <circle cx="110" cy="210" r="48" fill="#1E293B"/>
    <circle cx="110" cy="210" r="34" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <circle cx="110" cy="210" r="22" fill="#E2E8F0"/>
    <!-- Minimal Spoke Accents -->
    <path d="M 110 178 L 110 242 M 78 210 L 142 210 M 88 188 L 132 232 M 88 232 L 132 188" 
          stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="110" cy="210" r="10" fill="#2563EB"/>
    <circle cx="110" cy="210" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Front Wheel Assembly -->
  <g id="front-wheel">
    <circle cx="295" cy="210" r="48" fill="#1E293B"/>
    <circle cx="295" cy="210" r="34" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <circle cx="295" cy="210" r="22" fill="#E2E8F0"/>
    <path d="M 295 178 L 295 242 M 263 210 L 327 210 M 273 188 L 317 232 M 273 232 L 317 188" 
          stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="295" cy="210" r="10" fill="#2563EB"/>
    <circle cx="295" cy="210" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Rear Swingarm & Suspension -->
  <path d="M 110 210 L 175 195 L 185 220 Z" fill="#475569"/>
  <!-- Rear Monoshock Damper -->
  <line x1="145" y1="202" x2="168" y2="160" stroke="#14B8A6" stroke-width="7" stroke-linecap="round"/>
  <line x1="145" y1="202" x2="168" y2="160" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower Engine / Electric Motor Casing -->
  <rect x="165" y="175" width="60" height="42" rx="10" fill="#334155"/>
  <rect x="175" y="183" width="40" height="26" rx="6" fill="#1E293B"/>
  <circle cx="195" cy="196" r="8" fill="#2563EB"/>
  <!-- Health Battery Status Dot -->
  <circle cx="218" cy="183" r="3" fill="#10B981"/>

  <!-- Main Chassis Frame Structure -->
  <path d="M 110 210 L 180 150 L 260 135 L 210 200 Z" stroke="#475569" stroke-width="8" stroke-linejoin="round" fill="none"/>

  <!-- Sleek Modern Fuel Tank / Top Fairing (Primary Blue) -->
  <path d="M 175 148 
           C 180 120 215 115 258 122 
           C 268 124 274 134 268 144 
           L 245 160 
           L 182 158 Z" 
        fill="#2563EB"/>
  <!-- Tank Top Highlight -->
  <path d="M 190 132 C 210 125 240 125 255 130" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>

  <!-- Comfortable Minimalist Ergonomic Seat -->
  <path d="M 125 152 
           C 135 146 155 146 182 152 
           L 184 162 
           C 155 160 135 160 123 162 Z" 
        fill="#0F172A"/>

  <!-- Front Fork & Steering Column -->
  <line x1="295" y1="210" x2="260" y2="105" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
  <line x1="288" y1="205" x2="256" y2="108" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <!-- Front Fender -->
  <path d="M 270 185 C 280 170 310 170 322 188" stroke="#2563EB" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Handlebars & Round Mirror -->
  <path d="M 252 110 L 244 96 M 256 106 L 270 102" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <!-- Circular Modern Mirror -->
  <circle cx="242" cy="90" r="7" fill="#E2E8F0" stroke="#1E293B" stroke-width="2"/>

  <!-- Modern Circular LED Headlight -->
  <path d="M 275 125 C 285 125 292 132 292 140 C 292 148 285 155 275 155 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="282" cy="140" r="5" fill="#38BDF8"/>

  <!-- Rear Tail Light & Fender -->
  <path d="M 100 175 C 105 165 125 160 138 160" stroke="#64748B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <rect x="100" y="166" width="6" height="8" rx="2" fill="#EF4444"/>

  <!-- Subtle Health Pulse Float Badge (RideCare DNA) -->
  <g transform="translate(195, 80)">
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M -7 0 L -2 0 L 0 -6 L 2 7 L 4 -1 L 7 -1" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
