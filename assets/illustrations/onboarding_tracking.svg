<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 1. Staging Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="60%"  stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1A28"/>
    </linearGradient>

    <!-- 2. Universal Vehicle Pod Metallic Gradient -->
    <linearGradient id="vehiclePodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E4E7EB"/>
      <stop offset="40%"  stop-color="#BAC7D5"/>
      <stop offset="80%"  stop-color="#829AB1"/>
      <stop offset="100%" stop-color="#334E68"/>
    </linearGradient>

    <!-- 3. Journey Route Trajectory Gradient -->
    <linearGradient id="journeyRouteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#16A34A"/>
      <stop offset="45%"  stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- 4. Top Beacon Inner Gradient -->
    <linearGradient id="beaconInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="100%" stop-color="#081826"/>
    </linearGradient>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE GROUND SHADOW                                  -->
  <!-- ============================================================== -->
  <ellipse cx="256" cy="420" rx="160" ry="14" fill="#102A43" fill-opacity="0.14"/>

  <!-- ============================================================== -->
  <!-- 2. DIGITAL TRIP TRACKING CARD (Matches RideCare System)        -->
  <!-- ============================================================== -->
  <!-- Background Stacked Slot Deck -->
  <rect x="110" y="132" width="292" height="252" rx="28"
        fill="#0E1C2B" stroke="#334E68" stroke-width="2" stroke-dasharray="6 6" opacity="0.65"/>

  <!-- Main Staging Card Chassis -->
  <rect x="96" y="148" width="320" height="252" rx="28"
        fill="url(#cardGrad)" stroke="#334E68" stroke-width="3.5"/>

  <!-- Recessed Inner Surface -->
  <rect x="108" y="160" width="296" height="228" rx="22"
        fill="#071420" stroke="#1A2E44" stroke-width="1.5"/>

  <!-- 4 Corner Alignment Brackets -->
  <path d="M 132 182 L 122 182 L 122 192" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 380 182 L 390 182 L 390 192" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 364 L 122 374 L 132 374" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 390 364 L 390 374 L 380 374" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 3. TOP TRIP DISTANCE SCALE BRACKET                             -->
  <!-- ============================================================== -->
  <line x1="148" y1="184" x2="364" y2="184" stroke="#243B53" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="178" x2="148" y2="190" stroke="#486581" stroke-width="3" stroke-linecap="round"/>
  <line x1="364" y1="178" x2="364" y2="190" stroke="#486581" stroke-width="3" stroke-linecap="round"/>

  <!-- Journey Distance Measurement Pill -->
  <rect x="226" y="174" width="60" height="20" rx="10"
        fill="#102A43" stroke="#334E68" stroke-width="1.5"/>
  <line x1="238" y1="184" x2="256" y2="184" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="268" cy="184" r="2.5" fill="#00A6A6"/>

  <!-- ============================================================== -->
  <!-- 4. PRIMARY: VEHICLE JOURNEY ROUTE TRAJECTORY (Movement Focus)  -->
  <!-- ============================================================== -->
  <!-- Spatial Elevation Drop Lines -->
  <line x1="144" y1="330" x2="144" y2="354" stroke="#122436" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="256" y1="256" x2="256" y2="292" stroke="#122436" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="368" y1="210" x2="368" y2="246" stroke="#122436" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Road Track Underlay -->
  <path d="M 144 330
           C 184 236, 222 280, 260 252
           C 298 224, 330 180, 368 210"
        fill="none" stroke="#040B12" stroke-width="16" stroke-linecap="round"/>

  <!-- Route Outer Glow Aura (Cyan) -->
  <path d="M 144 330
           C 184 236, 222 280, 260 252
           C 298 224, 330 180, 368 210"
        fill="none" stroke="#00A6A6" stroke-opacity="0.25" stroke-width="12" stroke-linecap="round"/>

  <!-- Main Active Journey Trajectory Vector Path -->
  <path d="M 144 330
           C 184 236, 222 280, 260 252
           C 298 224, 330 180, 368 210"
        fill="none" stroke="url(#journeyRouteGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Movement Direction Chevron Markers -->
  <path d="M 198 266 L 206 260 L 200 254" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 314 220 L 322 214 L 316 208" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origin / Start Node (Green Success) -->
  <circle cx="144" cy="330" r="18" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle cx="144" cy="330" r="11" fill="#16A34A" stroke="#102A43" stroke-width="3"/>
  <circle cx="144" cy="330" r="4.5" fill="#FFFFFF"/>

  <!-- Destination Waypoint Node (Cyan Tracking Destination) -->
  <circle cx="368" cy="210" r="18" fill="none" stroke="#00A6A6" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle cx="368" cy="210" r="11" fill="#00A6A6" stroke="#102A43" stroke-width="3"/>
  <circle cx="368" cy="210" r="4.5" fill="#FFFFFF"/>

  <!-- ============================================================== -->
  <!-- 5. SECONDARY: SUBTLE UNIVERSAL VEHICLE IN MOTION               -->
  <!-- ============================================================== -->
  <!-- Vehicle Ground Shadow -->
  <ellipse cx="260" cy="268" rx="46" ry="9" fill="#040B12" fill-opacity="0.7"/>

  <!-- Universal 2.5D Aerodynamic Vehicle Pod riding on Journey Line -->
  <g id="universalVehicleJourney">
    <!-- Pod Forward Momentum Aura -->
    <polygon points="260,230 290,206 300,218 270,242" fill="#00A6A6" fill-opacity="0.22"/>

    <!-- Pod Outer Chassis (Alloy Metallic Gradient) -->
    <path d="M 260 220
             L 286 244
             C 288 246, 288 250, 286 254
             L 262 272
             C 260 274, 258 274, 256 272
             L 234 254
             C 232 250, 232 246, 234 244 Z"
          fill="url(#vehiclePodGrad)" stroke="#334E68" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Cockpit Dark Visor / Core -->
    <path d="M 260 228 L 275 244 L 260 259 L 245 244 Z"
          fill="#102A43" stroke="#1E3851" stroke-width="1.2"/>

    <!-- Active Heading Node (Cyan Pinpoint) -->
    <circle cx="260" cy="244" r="3.2" fill="#00E5FF"/>
  </g>

  <!-- ============================================================== -->
  <!-- 6. TRIP HISTORY MOVEMENT INDICATORS                            -->
  <!-- ============================================================== -->
  <!-- Trip Recorded Checkpoint 1 (Origin) -->
  <g transform="translate(138, 348)">
    <rect x="0" y="0" width="104" height="22" rx="11" fill="#102A43" stroke="#243B53" stroke-width="1.2"/>
    <circle cx="11" cy="11" r="4.5" fill="#16A34A"/>
    <line x1="22" y1="11" x2="88" y2="11" stroke="#BAC7D5" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Trip Recorded Checkpoint 2 (Destination) -->
  <g transform="translate(270, 348)">
    <rect x="0" y="0" width="104" height="22" rx="11" fill="#102A43" stroke="#243B53" stroke-width="1.2"/>
    <circle cx="11" cy="11" r="4.5" fill="#00A6A6"/>
    <line x1="22" y1="11" x2="88" y2="11" stroke="#BAC7D5" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ============================================================== -->
  <!-- 7. FLOATING TOP TRIP JOURNEY HUD BEACON                         -->
  <!-- ============================================================== -->
  <!-- Outer Orbit Pulse Ring -->
  <circle cx="256" cy="120" r="40" fill="none" stroke="#00A6A6" stroke-width="1.8" stroke-dasharray="6 5" stroke-opacity="0.45"/>

  <!-- Circular HUD Base Capsule -->
  <circle cx="256" cy="120" r="32" fill="#102A43" stroke="#334E68" stroke-width="2.8"/>
  <circle cx="256" cy="120" r="26" fill="url(#beaconInnerGrad)" stroke="#00A6A6" stroke-width="2"/>

  <!-- Trip Route Waypoint Symbol -->
  <circle cx="248" cy="124" r="3" fill="#16A34A"/>
  <circle cx="264" cy="116" r="3" fill="#00E5FF"/>
  <path d="M 248 124 C 252 118, 258 124, 264 116" fill="none" stroke="#F7F5EF" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 8. DIGITAL STATUS PILL (Subtle Bottom Ready Cue)               -->
  <!-- ============================================================== -->
  <rect x="186" y="412" width="140" height="18" rx="9"
        fill="#102A43" stroke="#243B53" stroke-width="1.5"/>
  <circle cx="202" cy="421" r="3.5" fill="#16A34A"/>
  <line x1="214" y1="421" x2="254" y2="421" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="264" cy="421" r="3" fill="#00A6A6"/>
  <line x1="274" y1="421" x2="302" y2="421" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
</svg>
