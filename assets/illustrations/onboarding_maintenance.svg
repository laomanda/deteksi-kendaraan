<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" fill="none">
  <!-- Subtle Background Circles -->
  <circle cx="260" cy="140" r="100" fill="#2563EB" fill-opacity="0.04"/>
  <circle cx="260" cy="140" r="75" stroke="#14B8A6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Base Ground Plane -->
  <ellipse cx="160" cy="255" rx="130" ry="10" fill="#E2E8F0" fill-opacity="0.7"/>

  <!-- Vehicle Silhouette in Background (Clean Modern Car) -->
  <g id="bg-vehicle" transform="translate(-10, 30)">
    <path d="M 90 178 C 102 148 126 135 158 135 L 180 135 C 202 135 220 150 228 178 Z" fill="#334155"/>
    <path d="M 50 190 C 50 182 58 178 66 178 L 90 178 C 102 146 128 132 160 132 L 182 132 C 208 132 226 148 238 178 L 246 180 C 252 182 256 186 256 192 L 256 206 C 256 212 252 216 246 216 L 228 216 C 226 198 212 185 194 185 C 176 185 162 198 160 216 L 118 216 C 116 198 102 185 84 185 C 66 185 52 198 50 216 L 46 216 C 42 216 40 212 40 208 L 40 198 C 40 194 44 190 50 190 Z" fill="#94A3B8" fill-opacity="0.65"/>
    <circle cx="84" cy="216" r="20" fill="#475569"/>
    <circle cx="84" cy="216" r="12" fill="#E2E8F0"/>
    <circle cx="194" cy="216" r="20" fill="#475569"/>
    <circle cx="194" cy="216" r="12" fill="#E2E8F0"/>
  </g>

  <!-- Floating Smart Maintenance Card (Hero Feature) -->
  <g transform="translate(195, 45)">
    <!-- Card Container with Soft Shadow -->
    <rect x="0" y="0" width="165" height="195" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Card Top Accent Header Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 149 0 C 157.84 0 165 7.16 165 16 L 165 40 L 0 40 Z" fill="#2563EB"/>

    <!-- Mini Calendar / Schedule Glyphs in Header -->
    <rect x="18" y="14" width="14" height="14" rx="3" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
    <line x1="22" y1="11" x2="22" y2="15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="28" y1="11" x2="28" y2="15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Header Abstract Line -->
    <rect x="42" y="18" width="65" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Checklist Item 1: Completed Service (Oli Mesin) -->
    <g transform="translate(18, 62)">
      <circle cx="10" cy="10" r="10" fill="#10B981"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="4" width="85" height="6" rx="3" fill="#1E293B"/>
      <rect x="30" y="14" width="50" height="4" rx="2" fill="#94A3B8"/>
    </g>

    <!-- Checklist Item 2: Completed Service (Rem & Kampas) -->
    <g transform="translate(18, 102)">
      <circle cx="10" cy="10" r="10" fill="#10B981"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="4" width="75" height="6" rx="3" fill="#1E293B"/>
      <rect x="30" y="14" width="45" height="4" rx="2" fill="#94A3B8"/>
    </g>

    <!-- Checklist Item 3: Upcoming Scheduled Service (Aki / Filter) -->
    <g transform="translate(18, 142)">
      <circle cx="10" cy="10" r="10" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="10" cy="10" r="3.5" fill="#3B82F6"/>
      <rect x="30" y="4" width="80" height="6" rx="3" fill="#64748B"/>
      <rect x="30" y="14" width="55" height="4" rx="2" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Minimalist Maintenance Tool Icon Badge (Floating Wrench / Caliper) -->
  <g transform="translate(160, 195)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="0" cy="0" r="23" fill="#EFF6FF"/>
    
    <!-- Modern Minimalist Wrench Geometry -->
    <g transform="rotate(45)">
      <!-- Shaft -->
      <rect x="-3" y="-14" width="6" height="28" rx="2.5" fill="#2563EB"/>
      <!-- Top Open Jaw -->
      <path d="M -8 -12 C -8 -18 8 -18 8 -12 L 4 -12 C 4 -14 -4 -14 -4 -12 Z" fill="#2563EB"/>
      <!-- Bottom Ring -->
      <circle cx="0" cy="14" r="6" fill="#2563EB"/>
      <circle cx="0" cy="14" r="3" fill="#EFF6FF"/>
    </g>
  </g>
</svg>
