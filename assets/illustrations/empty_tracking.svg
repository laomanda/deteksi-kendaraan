<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 1. Staging Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="60%"  stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1A28"/>
    </linearGradient>

    <!-- 2. Universal Vehicle Pod Metallic Gradient -->
    <linearGradient id="podMetallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E4E7EB"/>
      <stop offset="40%"  stop-color="#BAC7D5"/>
      <stop offset="80%"  stop-color="#829AB1"/>
      <stop offset="100%" stop-color="#334E68"/>
    </linearGradient>

    <!-- 3. Journey Route Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#16A34A"/>
      <stop offset="50%"  stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- 4. Top Beacon Inner Gradient -->
    <linearGradient id="beaconInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="100%" stop-color="#081826"/>
    </linearGradient>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE GROUND SHADOW                                  -->
  <!-- ============================================================== -->
  <ellipse cx="256" cy="414" rx="160" ry="14" fill="#102A43" fill-opacity="0.14"/>

  <!-- ============================================================== -->
  <!-- 2. DIGITAL TRIP STAGING CARD (Matches empty_garage style)      -->
  <!-- ============================================================== -->
  <!-- Background Stacked Slot Deck -->
  <rect x="110" y="136" width="292" height="236" rx="28"
        fill="#0E1C2B" stroke="#334E68" stroke-width="2" stroke-dasharray="6 6" opacity="0.65"/>

  <!-- Main Staging Card Chassis -->
  <rect x="96" y="152" width="320" height="238" rx="28"
        fill="url(#cardGrad)" stroke="#334E68" stroke-width="3.5"/>

  <!-- Recessed Inner Canvas Surface -->
  <rect x="108" y="164" width="296" height="214" rx="22"
        fill="#071420" stroke="#1A2E44" stroke-width="1.5"/>

  <!-- 4 Corner Digital Staging Alignment Brackets -->
  <path d="M 132 186 L 122 186 L 122 196" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 380 186 L 390 186 L 390 196" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 346 L 122 356 L 132 356" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 390 346 L 390 356 L 380 356" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 3. SUPPORTING ELEMENT: SIMPLE ROUTE PATH                       -->
  <!-- ============================================================== -->
  <!-- Route Base Shadow / Underlay -->
  <path d="M 148 320
           C 190 320, 212 274, 256 274
           C 300 274, 322 228, 364 228"
        fill="none" stroke="#040B12" stroke-width="14" stroke-linecap="round"/>

  <!-- Route Outer Glow Aura (Cyan) -->
  <path d="M 148 320
           C 190 320, 212 274, 256 274
           C 300 274, 322 228, 364 228"
        fill="none" stroke="#00A6A6" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>

  <!-- Active Route Trajectory Vector Line -->
  <path d="M 148 320
           C 190 320, 212 274, 256 274
           C 300 274, 322 228, 364 228"
        fill="none" stroke="url(#routeGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Journey Origin Start Waypoint (Green Success) -->
  <circle cx="148" cy="320" r="16" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle cx="148" cy="320" r="10" fill="#16A34A" stroke="#102A43" stroke-width="2.5"/>
  <circle cx="148" cy="320" r="4" fill="#FFFFFF"/>

  <!-- Destination Waypoint Node (Cyan) -->
  <circle cx="364" cy="228" r="14" fill="none" stroke="#00A6A6" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle cx="364" cy="228" r="9" fill="#00A6A6" stroke="#102A43" stroke-width="2.5"/>
  <circle cx="364" cy="228" r="3.5" fill="#FFFFFF"/>

  <!-- ============================================================== -->
  <!-- 4. MAIN OBJECT: UNIVERSAL VEHICLE TELEMETRY LOCATOR SYMBOL     -->
  <!--    (Universal for all vehicles: Car, Motorcycle, Scooter)      -->
  <!-- ============================================================== -->
  <!-- Spatial Ground Shadow Beneath Vehicle Pod -->
  <ellipse cx="256" cy="286" rx="46" ry="10" fill="#040B12" fill-opacity="0.65"/>

  <!-- Universal Telemetry Vehicle Locator Pod -->
  <g id="universalVehicleLocator">
    <!-- Outer Kinetic Pulse Ring -->
    <circle cx="256" cy="274" r="34" fill="none" stroke="#00A6A6" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.5"/>

    <!-- Universal Aerodynamic Vehicle Locator Diamond / Shield Body -->
    <path d="M 256 244
             L 282 268
             C 284 270, 284 274, 282 278
             L 258 296
             C 256 298, 254 298, 252 296
             L 230 278
             C 228 274, 228 270, 230 268 Z"
          fill="url(#podMetallicGrad)" stroke="#334E68" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner Core Telemetry Glass Lens -->
    <path d="M 256 252
             L 274 270
             L 256 286
             L 238 270 Z"
          fill="#102A43" stroke="#1E3851" stroke-width="1.5"/>

    <!-- Universal Forward Direction Indicator (Cyan) -->
    <polygon points="256,256 266,272 256,268 246,272" fill="#00A6A6"/>
    <circle cx="256" cy="268" r="2.5" fill="#00E5FF"/>
  </g>

  <!-- ============================================================== -->
  <!-- 5. FLOATING "START JOURNEY" ACTIVITY BEACON                     -->
  <!-- ============================================================== -->
  <!-- Outer Orbit Pulse Ring -->
  <circle cx="256" cy="150" r="44" fill="none" stroke="#00A6A6" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.4"/>

  <!-- Circular Base Capsule -->
  <circle cx="256" cy="150" r="34" fill="#102A43" stroke="#334E68" stroke-width="3"/>
  <circle cx="256" cy="150" r="28" fill="url(#beaconInnerGrad)" stroke="#00A6A6" stroke-width="2.2"/>

  <!-- Clean Start Journey Play Indicator (▶) -->
  <polygon points="250,138 268,150 250,162" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ============================================================== -->
  <!-- 6. DIGITAL STATUS PILL (Subtle Bottom Ready Cue)               -->
  <!-- ============================================================== -->
  <rect x="186" y="388" width="140" height="18" rx="9"
        fill="#102A43" stroke="#243B53" stroke-width="1.5"/>
  <circle cx="202" cy="397" r="3.5" fill="#16A34A"/>
  <line x1="214" y1="397" x2="254" y2="397" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="264" cy="397" r="3" fill="#00A6A6"/>
  <line x1="274" y1="397" x2="302" y2="397" stroke="#334E68" stroke-width="2" stroke-linecap="round"/>
</svg>
