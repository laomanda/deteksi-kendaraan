<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="70%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#F7F5EF"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 76.8) scale(1.28)">
    <!-- Distant Scenic Mountain Ridges (Midnight Navy Silhouette) -->
    <path d="M40 160 L120 120 L180 148 L250 110 L330 156 L360 160 Z" fill="#243B53" fill-opacity="0.4"/>
    <path d="M70 160 L140 134 L210 154 L280 128 L350 160 Z" fill="#334E68" fill-opacity="0.3"/>

    <!-- Glowing Horizon Sun Disc / Beacon (Electric Cyan Glow) -->
    <circle cx="200" cy="130" r="28" fill="#00A6A6" fill-opacity="0.2"/>
    <circle cx="200" cy="130" r="14" fill="#00A6A6" fill-opacity="0.4"/>
    <circle cx="200" cy="130" r="6" fill="#F7F5EF"/>

    <!-- Perspective Open Scenic Highway Converging to Horizon -->
    <path d="M50 240 L188 136 L212 136 L350 240 Z" fill="url(#roadGrad)" stroke="#334E68" stroke-width="1.5"/>

    <!-- High-Contrast Road Center Dashed Line (Perspective Shrink) -->
    <line x1="200" y1="236" x2="200" y2="210" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="198" x2="200" y2="180" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="172" x2="200" y2="160" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="154" x2="200" y2="146" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Starting Track Gate / Checkered Line at Forefront -->
    <path d="M70 236 L330 236" stroke="#00A6A6" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- Floating Start Location Pin (Safe Green) -->
    <g transform="translate(200, 100)">
      <path d="M0 -24 C-10 -24, -16 -18, -16 -8 C-16 4, 0 12, 0 12 C0 12, 16 4, 16 -8 C16 -18, 10 -24, 0 -24 Z" 
            fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="-10" r="5" fill="#FFFFFF"/>
      <circle cx="0" cy="-10" r="2.5" fill="#16A34A"/>
    </g>

    <!-- Motivational Tag in Space Grotesk -->
    <text x="200" y="264" fill="#627D98" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">
      SIAP UNTUK PERJALANAN PERDANA
    </text>
  </g>
</svg>
