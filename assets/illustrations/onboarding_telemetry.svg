<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 1. Staging Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="60%"  stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1A28"/>
    </linearGradient>

    <!-- 2. Mechanical Alloy Gear Gradient -->
    <linearGradient id="alloyGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E4E7EB"/>
      <stop offset="35%"  stop-color="#BAC7D5"/>
      <stop offset="70%"  stop-color="#829AB1"/>
      <stop offset="100%" stop-color="#334E68"/>
    </linearGradient>

    <!-- 3. Telemetry Field Glow -->
    <radialGradient id="telemetryFieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00A6A6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00A6A6" stop-opacity="0.0"/>
    </radialGradient>

    <!-- 4. Beacon Inner Gradient -->
    <linearGradient id="beaconInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E3851"/>
      <stop offset="100%" stop-color="#081826"/>
    </linearGradient>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE GROUND SHADOW                                  -->
  <!-- ============================================================== -->
  <ellipse cx="256" cy="420" rx="160" ry="14" fill="#102A43" fill-opacity="0.14"/>

  <!-- ============================================================== -->
  <!-- 2. DIGITAL TELEMETRY STAGING CARD (Clean & Uncluttered)        -->
  <!-- ============================================================== -->
  <!-- Background Stacked Slot Deck -->
  <rect x="110" y="132" width="292" height="252" rx="28"
        fill="#0E1C2B" stroke="#334E68" stroke-width="2" stroke-dasharray="6 6" opacity="0.65"/>

  <!-- Main Telemetry Card Chassis -->
  <rect x="96" y="148" width="320" height="252" rx="28"
        fill="url(#cardGrad)" stroke="#334E68" stroke-width="3.5"/>

  <!-- Recessed Inner Surface -->
  <rect x="108" y="160" width="296" height="228" rx="22"
        fill="#071420" stroke="#1A2E44" stroke-width="1.5"/>

  <!-- 4 Corner Alignment Brackets -->
  <path d="M 132 182 L 122 182 L 122 192" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 380 182 L 390 182 L 390 192" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 122 364 L 122 374 L 132 374" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 390 364 L 390 374 L 380 374" fill="none" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 3. PRIMARY HERO: UNIVERSAL MECHANICAL TELEMETRY CORE           -->
  <!-- ============================================================== -->
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="270" r="76" fill="url(#telemetryFieldGlow)"/>

  <!-- Concentric Telemetry Scan Orbit Rings -->
  <circle cx="256" cy="270" r="84" fill="none" stroke="#334E68" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.45"/>
  <circle cx="256" cy="270" r="66" fill="none" stroke="#00A6A6" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.7"/>

  <!-- Precision 8-Tooth Mechanical Alloy Gear Core -->
  <g transform="translate(256, 270) scale(0.72)">
    <path d="
      M -12 -58 L 12 -58 L 16 -38 L 36 -46 L 52 -30 L 38 -10 L 46 10 
      L 68 14 L 68 38 L 46 42 L 38 62 L 52 78 L 36 94 L 16 86 L 12 106 
      L -12 106 L -16 86 L -36 94 L -52 78 L -38 62 L -46 42 L -68 38 
      L -68 14 L -46 10 L -38 -10 L -52 -30 L -36 -46 L -16 -38 Z"
      transform="translate(0, -24)"
      fill="url(#alloyGearGrad)" stroke="#102A43" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner Core Cockpit Lens -->
    <circle cx="0" cy="0" r="34" fill="#102A43" stroke="#334E68" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="#081826" stroke="#00A6A6" stroke-width="2.8"/>
    
    <!-- Central Telemetry Pulse Beacon -->
    <circle cx="0" cy="0" r="8" fill="#00E5FF"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BALANCED TELEMETRY STATUS PILLS (Powertrain & Electrical)   -->
  <!-- ============================================================== -->
  <!-- Left Telemetry Indicator: Powertrain & Mechanical Health (Green) -->
  <g transform="translate(132, 260)">
    <rect x="0" y="0" width="46" height="20" rx="10" fill="#102A43" stroke="#16A34A" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="3.5" fill="#16A34A"/>
    <path d="M 8 10 L 9.5 11.5 L 12.5 8.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="10" x2="38" y2="10" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Telemetry Indicator: Electrical & Sensor Active (Cyan) -->
  <g transform="translate(334, 260)">
    <rect x="0" y="0" width="46" height="20" rx="10" fill="#102A43" stroke="#00A6A6" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="3.5" fill="#00A6A6"/>
    <line x1="18" y1="10" x2="38" y2="10" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ============================================================== -->
  <!-- 5. FLOATING TOP TELEMETRY INTELLIGENCE HUD BEACON              -->
  <!-- ============================================================== -->
  <!-- Outer Orbit Pulse Ring -->
  <circle cx="256" cy="120" r="40" fill="none" stroke="#00A6A6" stroke-width="1.8" stroke-dasharray="6 5" stroke-opacity="0.45"/>

  <!-- Circular HUD Base Capsule -->
  <circle cx="256" cy="120" r="32" fill="#102A43" stroke="#334E68" stroke-width="2.8"/>
  <circle cx="256" cy="120" r="26" fill="url(#beaconInnerGrad)" stroke="#00A6A6" stroke-width="2"/>

  <!-- Vehicle Telemetry Intelligence Satellite Pulse Icon -->
  <circle cx="256" cy="120" r="4.5" fill="#00E5FF"/>
  <path d="M 244 112 C 251 106, 261 106, 268 112" fill="none" stroke="#F7F5EF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 239 107 C 249 99, 263 99, 273 107" fill="none" stroke="#00A6A6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 6. DIGITAL STATUS PILL (Subtle Bottom Ready Cue)               -->
  <!-- ============================================================== -->
  <rect x="186" y="388" width="140" height="18" rx="9"
        fill="#102A43" stroke="#243B53" stroke-width="1.5"/>
  <circle cx="202" cy="397" r="3.5" fill="#16A34A"/>
  <line x1="214" y1="397" x2="254" y2="397" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="264" cy="397" r="3" fill="#00A6A6"/>
  <line x1="274" y1="397" x2="302" y2="397" stroke="#00A6A6" stroke-width="2" stroke-linecap="round"/>
</svg>
