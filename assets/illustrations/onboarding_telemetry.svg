<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="telemetryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A6A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#102A43" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(0, 51.2) scale(1.28)">
    <!-- Ambient Telemetry Field Glow -->
    <circle cx="200" cy="160" r="140" fill="url(#telemetryGlow)"/>

    <!-- Concentric Radar Pulse Scanning Rings (Electric Cyan) -->
    <circle cx="200" cy="160" r="130" fill="none" stroke="#334E68" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="200" cy="160" r="100" fill="none" stroke="#00A6A6" stroke-width="2" stroke-dasharray="12 6"/>
    <circle cx="200" cy="160" r="65" fill="none" stroke="#00A6A6" stroke-width="2"/>

    <!-- Radar Crosshairs Coordinate Grid -->
    <line x1="200" y1="20" x2="200" y2="300" stroke="#334E68" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="40" y1="160" x2="360" y2="160" stroke="#334E68" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Isometric 2.5D Silhouette of Vehicle (Scooter / Bike Silhouette Center Stage) -->
    <g transform="translate(100, 95) scale(0.5)">
      <ellipse cx="200" cy="210" rx="160" ry="16" fill="#102A43" fill-opacity="0.15"/>
      <!-- Wheels -->
      <circle cx="100" cy="160" r="44" fill="#1A202C" stroke="#334E68" stroke-width="3"/>
      <circle cx="100" cy="160" r="26" fill="#0F172A"/>
      <circle cx="300" cy="160" r="44" fill="#1A202C" stroke="#334E68" stroke-width="3"/>
      <circle cx="300" cy="160" r="26" fill="#0F172A"/>
      <!-- Body Profile -->
      <path d="M120 160 L180 120 L260 120 L300 160 L240 180 L140 180 Z" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <path d="M180 120 L220 90 L260 120 Z" fill="#243B53"/>
      <rect x="230" y="70" width="30" height="12" rx="4" fill="#00A6A6"/>
    </g>

    <!-- Interactive Telemetry Sensor Nodes with Pulsing Rays -->
    <!-- Node 1: Engine Telemetry (Safe Green) -->
    <g transform="translate(160, 130)">
      <circle cx="0" cy="0" r="10" fill="#16A34A" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="5" fill="#16A34A" stroke="#F7F5EF" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-50" y2="-40" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Tag Card -->
      <rect x="-124" y="-56" width="70" height="22" rx="6" fill="#102A43" stroke="#16A34A" stroke-width="1.5"/>
      <text x="-89" y="-42" fill="#F7F5EF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">MESIN 100%</text>
    </g>

    <!-- Node 2: Brake Telemetry (Electric Cyan) -->
    <g transform="translate(248, 172)">
      <circle cx="0" cy="0" r="10" fill="#00A6A6" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="5" fill="#00A6A6" stroke="#F7F5EF" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#00A6A6" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Tag Card -->
      <rect x="44" y="28" width="70" height="22" rx="6" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
      <text x="79" y="42" fill="#F7F5EF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">REM OPTIMAL</text>
    </g>

    <!-- Node 3: Transmission Status (Safe Green) -->
    <g transform="translate(142, 178)">
      <circle cx="0" cy="0" r="8" fill="#16A34A" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="4" fill="#16A34A" stroke="#F7F5EF" stroke-width="1.5"/>
    </g>

    <!-- Central Status Floating Badge: "● KONDISI AMAN" -->
    <g transform="translate(200, 260)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <circle cx="-58" cy="0" r="5" fill="#16A34A"/>
      <text x="4" y="5" fill="#F7F5EF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
        KONDISI AMAN
      </text>
    </g>
  </g>
</svg>
