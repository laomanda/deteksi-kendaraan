<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <radialGradient id="parkingBayGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#00A6A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#102A43" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Parking Bay Ground Spotlight -->
  <ellipse cx="200" cy="180" rx="160" ry="60" fill="url(#parkingBayGlow)"/>

  <!-- Perspective 3D Digital Garage Floor Bay Lines (Cyan & Steel Blue) -->
  <g stroke="#334E68" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Outer Bay Perspective Angled Bounds -->
    <path d="M70 230 L130 140 L270 140 L330 230" stroke="#00A6A6" stroke-width="2.5"/>
    <!-- Yellow/Amber Wheel Stop Bumpers -->
    <rect x="150" y="146" width="100" height="8" rx="4" fill="#F59E0B" stroke="#102A43" stroke-width="1"/>
    
    <!-- Floor Marker Alignment Lines -->
    <line x1="120" y1="200" x2="160" y2="155" stroke-dasharray="6 6"/>
    <line x1="280" y1="200" x2="240" y2="155" stroke-dasharray="6 6"/>
    <line x1="200" y1="220" x2="200" y2="165" stroke-dasharray="4 8" stroke="#00A6A6"/>
  </g>

  <!-- Empty Vehicle Pedestal Beacon Stand (Central Platform) -->
  <ellipse cx="200" cy="185" rx="70" ry="24" fill="#102A43" stroke="#00A6A6" stroke-width="2"/>
  <ellipse cx="200" cy="180" rx="60" ry="20" fill="#1E3851" stroke="#334E68" stroke-width="1.5"/>

  <!-- Holographic Plus / Add Vehicle Indicator Icon Hovering -->
  <g transform="translate(200, 110)">
    <!-- Floating Circular HUD Badge -->
    <circle cx="0" cy="0" r="36" fill="#102A43" stroke="#00A6A6" stroke-width="2"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#334E68" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Center Plus / Garage Sign Symbol -->
    <path d="M-14 0 L14 0 M0 -14 L0 14" stroke="#F7F5EF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#00A6A6"/>
  </g>

  <!-- Ground Vehicle Wheel Stop Chocks -->
  <ellipse cx="140" cy="210" rx="14" ry="4" fill="#102A43" fill-opacity="0.3"/>
  <ellipse cx="260" cy="210" rx="14" ry="4" fill="#102A43" fill-opacity="0.3"/>

  <!-- Minimalist Digital Label -->
  <text x="200" y="248" fill="#627D98" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">
    SLOT GARASI BERSIH
  </text>
</svg>
