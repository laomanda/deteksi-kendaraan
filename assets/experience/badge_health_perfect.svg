<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="shieldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Technical Ambient Shadow -->
  <circle cx="80" cy="84" r="64" fill="#102A43" fill-opacity="0.12"/>

  <!-- Outer Shield Crest in Midnight Navy -->
  <path d="M80 16 L134 38 C134 94 112 134 80 148 C48 134 26 94 26 38 Z" 
        fill="#102A43" stroke="#334E68" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Safe Green Shield -->
  <path d="M80 26 L124 44 C124 90 106 124 80 136 C54 124 36 90 36 44 Z" 
        fill="url(#shieldGreen)" stroke="#16A34A" stroke-width="1.5"/>

  <!-- Dynamic Flanking Wings / Laurel Accents in Electric Cyan -->
  <path d="M42 66 C42 66 22 74 16 88 C26 90 40 82 40 82" fill="#00A6A6" opacity="0.9"/>
  <path d="M118 66 C118 66 138 74 144 88 C134 90 120 82 120 82" fill="#00A6A6" opacity="0.9"/>

  <!-- Center Pure White Checkmark of Verified Health -->
  <circle cx="80" cy="74" r="28" fill="#102A43" stroke="#F7F5EF" stroke-width="2"/>
  <path d="M68 74 L76 82 L92 66" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Space Grotesk "100% PRIMA" Banner -->
  <g transform="translate(80, 116)">
    <rect x="-42" y="-10" width="84" height="20" rx="10" fill="#102A43" stroke="#00A6A6" stroke-width="1.5"/>
    <text x="0" y="4" fill="#F7F5EF" font-family="monospace" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="1">
      100% PRIMA
    </text>
  </g>
</svg>
