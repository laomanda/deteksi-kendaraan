<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <!-- Technical Ground Shadow -->
  <ellipse cx="200" cy="226" rx="120" ry="12" fill="#102A43" fill-opacity="0.10"/>

  <!-- Digital Service Log Clipboard / Ledger Tablet -->
  <g transform="translate(130, 40)">
    <!-- Clipboard Board Backing -->
    <rect x="0" y="0" width="140" height="180" rx="14" fill="#0B1C2D" stroke="#334E68" stroke-width="2"/>

    <!-- Top Heavy-Duty Steel Binding Clip -->
    <rect x="42" y="-10" width="56" height="20" rx="6" fill="#334E68" stroke="#102A43" stroke-width="1.5"/>
    <circle cx="70" cy="-2" r="4" fill="#F7F5EF"/>

    <!-- Document Surface Paper Sheet (Warm White) -->
    <rect x="12" y="20" width="116" height="146" rx="6" fill="#F7F5EF"/>

    <!-- Ledger Header Lines -->
    <rect x="24" y="34" width="60" height="8" rx="3" fill="#102A43"/>
    <rect x="24" y="48" width="40" height="4" rx="2" fill="#627D98"/>

    <!-- Pristine Clean Checkbox Timeline Entries (Waiting for first record) -->
    <!-- Row 1 Placeholder -->
    <rect x="24" y="68" width="12" height="12" rx="3" fill="#E2E8F0" stroke="#00A6A6" stroke-width="1.5"/>
    <line x1="44" y1="74" x2="100" y2="74" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Row 2 Placeholder -->
    <rect x="24" y="94" width="12" height="12" rx="3" fill="#E2E8F0" stroke="#334E68" stroke-width="1.5"/>
    <line x1="44" y1="100" x2="90" y2="100" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Row 3 Placeholder -->
    <rect x="24" y="120" width="12" height="12" rx="3" fill="#E2E8F0" stroke="#334E68" stroke-width="1.5"/>
    <line x1="44" y1="126" x2="80" y2="126" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Golden Quill / Digital Stylus Pen Resting Across -->
    <g transform="rotate(35 80 110)">
      <rect x="74" y="60" width="8" height="70" rx="3" fill="#00A6A6" stroke="#102A43" stroke-width="1"/>
      <polygon points="74,130 82,130 78,144" fill="#F59E0B"/>
      <circle cx="78" cy="144" r="1" fill="#102A43"/>
    </g>
  </g>

  <!-- Clean Verification Ribbon Badge in Safe Green -->
  <g transform="translate(260, 160)">
    <circle cx="0" cy="0" r="22" fill="#16A34A" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-8 0 L-2 6 L8 -4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Space Grotesk Empty State Message Tag -->
  <text x="200" y="254" fill="#627D98" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">
    BELUM ADA CATATAN SERVIS
  </text>
</svg>
