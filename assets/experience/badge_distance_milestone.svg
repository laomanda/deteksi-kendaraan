<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="medallionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <!-- Technical Shadow Base -->
  <circle cx="80" cy="84" r="64" fill="#102A43" fill-opacity="0.12"/>

  <!-- Outer Hexagonal Technical Bevel Ring -->
  <polygon points="80,12 136,44 136,108 80,140 24,108 24,44" 
           fill="url(#medallionGrad)" stroke="#334E68" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Concentric Dial Ring -->
  <circle cx="80" cy="76" r="48" fill="#0B1C2D" stroke="#00A6A6" stroke-width="2"/>
  <circle cx="80" cy="76" r="42" fill="none" stroke="#334E68" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Laurel Wreath Leaves (Left & Right Flanks) -->
  <g stroke="#00A6A6" stroke-width="2" fill="none">
    <!-- Left Wreath -->
    <path d="M48 64 C44 72, 44 84, 52 92"/>
    <ellipse cx="44" cy="70" rx="3" ry="5" transform="rotate(-30 44 70)" fill="#00A6A6"/>
    <ellipse cx="46" cy="82" rx="3" ry="5" transform="rotate(-15 46 82)" fill="#00A6A6"/>
    <!-- Right Wreath -->
    <path d="M112 64 C116 72, 116 84, 108 92"/>
    <ellipse cx="116" cy="70" rx="3" ry="5" transform="rotate(30 116 70)" fill="#00A6A6"/>
    <ellipse cx="114" cy="82" rx="3" ry="5" transform="rotate(15 114 82)" fill="#00A6A6"/>
  </g>

  <!-- Center Distance Metric in Space Grotesk -->
  <text x="80" y="68" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">
    MILESTONE
  </text>
  <text x="80" y="86" fill="#F7F5EF" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">
    1,000
  </text>
  <text x="80" y="98" fill="#00A6A6" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="2">
    KILOMETER
  </text>

  <!-- Star Accent at Apex -->
  <polygon points="80,32 82,37 87,37 83,40 85,45 80,42 75,45 77,40 73,37 78,37" fill="#F59E0B"/>
</svg>
