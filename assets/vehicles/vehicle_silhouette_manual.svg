<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="manualBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#243B53"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="metalEngine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486581"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="390" rx="320" ry="16" fill="#102A43" fill-opacity="0.08"/>

  <!-- Rear Wheel (17 inch Sport Rim) -->
  <g id="rearSportWheel">
    <circle cx="230" cy="300" r="82" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="230" cy="300" r="60" fill="#0F172A"/>
    <!-- 5-Spoke Split Alloy -->
    <circle cx="230" cy="300" r="50" fill="none" stroke="#334E68" stroke-width="8"/>
    <line x1="230" y1="250" x2="230" y2="350" stroke="#486581" stroke-width="5"/>
    <line x1="180" y1="300" x2="280" y2="300" stroke="#486581" stroke-width="5"/>
    <line x1="195" y1="265" x2="265" y2="335" stroke="#486581" stroke-width="5"/>
    <!-- Rear Sprocket & Chain -->
    <circle cx="230" cy="300" r="28" fill="#334E68" stroke="#00A6A6" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="230" cy="300" r="10" fill="#F7F5EF"/>
  </g>

  <!-- Front Wheel (17 inch Sport Rim with Dual Disc) -->
  <g id="frontSportWheel">
    <circle cx="590" cy="300" r="82" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="590" cy="300" r="60" fill="#0F172A"/>
    <circle cx="590" cy="300" r="50" fill="none" stroke="#334E68" stroke-width="8"/>
    <line x1="590" y1="250" x2="590" y2="350" stroke="#486581" stroke-width="5"/>
    <line x1="540" y1="300" x2="640" y2="300" stroke="#486581" stroke-width="5"/>
    <line x1="555" y1="265" x2="625" y2="335" stroke="#486581" stroke-width="5"/>
    <!-- Big Front Floating Rotor & Cyan Caliper -->
    <circle cx="590" cy="300" r="38" fill="none" stroke="#627D98" stroke-width="5" stroke-dasharray="8 4"/>
    <rect x="606" y="276" width="20" height="28" rx="4" fill="#00A6A6"/>
    <circle cx="590" cy="300" r="10" fill="#F7F5EF"/>
  </g>

  <!-- Drive Chain & Swingarm -->
  <path d="M230 300 L380 290 L400 310 L230 316 Z" fill="#243B53" stroke="#334E68" stroke-width="2"/>
  <line x1="230" y1="288" x2="380" y2="280" stroke="#00A6A6" stroke-width="3" stroke-dasharray="6 3"/>
  <line x1="230" y1="312" x2="380" y2="306" stroke="#00A6A6" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Exposed Engine Crankcase & Cylinder Block with Cooling Fins -->
  <g transform="translate(360, 240)">
    <rect x="0" y="20" width="80" height="60" rx="10" fill="url(#metalEngine)" stroke="#334E68" stroke-width="2"/>
    <!-- Cylinder Head tilted forward 45 deg -->
    <path d="M50 20 L80 -10 L110 10 L80 40 Z" fill="#334E68" stroke="#102A43" stroke-width="2"/>
    <!-- Cooling Fins -->
    <line x1="60" y1="12" x2="96" y2="-6" stroke="#627D98" stroke-width="3"/>
    <line x1="68" y1="22" x2="104" y2="4" stroke="#627D98" stroke-width="3"/>
    <line x1="76" y1="32" x2="110" y2="14" stroke="#627D98" stroke-width="3"/>
    <!-- Clutch Cover Circular Casing -->
    <circle cx="34" cy="54" r="22" fill="#102A43" stroke="#00A6A6" stroke-width="2"/>
    <circle cx="34" cy="54" r="6" fill="#F7F5EF"/>
  </g>

  <!-- Exhaust Downpipe & Underbelly Muffler -->
  <path d="M440 270 C460 330 420 344 380 344 L280 344 L270 326 L360 326 Z" fill="#334E68" stroke="#102A43" stroke-width="2"/>

  <!-- Trellis Frame Tubes (Cyan & Steel Blue Accent) -->
  <g stroke="#00A6A6" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="360" y1="210" x2="430" y2="250" />
    <line x1="430" y1="250" x2="520" y2="180" />
    <line x1="360" y1="210" x2="430" y2="190" />
    <line x1="430" y1="190" x2="520" y2="180" />
    <line x1="430" y1="190" x2="390" y2="290" />
  </g>

  <!-- Muscular Sculpted Fuel Tank -->
  <path d="M370 210 C390 150 470 146 510 176 L524 214 L440 226 Z" 
        fill="url(#manualBody)" stroke="#334E68" stroke-width="2"/>
  <path d="M400 170 C440 160 480 164 500 184" fill="none" stroke="#00A6A6" stroke-width="3"/>

  <!-- Stepped Split Rider & Pillion Seat -->
  <path d="M220 186 L290 180 L320 214 L380 214 L360 230 L280 210 Z" 
        fill="#0F172A" stroke="#334E68" stroke-width="2"/>
  <polygon points="214,186 280,180 270,196 220,196" fill="#00A6A6"/>

  <!-- Sharp Tail Cowl & Rear Fender -->
  <path d="M200 186 L270 196 L290 220 L230 220 Z" fill="#102A43"/>
  <polygon points="196,186 186,192 198,196" fill="#DC2626"/>

  <!-- Headlight Mask & Compact Flyscreen -->
  <polygon points="536,170 566,150 560,186 534,196" fill="#102A43"/>
  <polygon points="556,158 568,162 558,176" fill="#00A6A6"/>

  <!-- Wide Drag Handlebars & Mirrors -->
  <line x1="504" y1="140" x2="526" y2="160" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="136" r="6" fill="#00A6A6"/>

  <!-- Inverted (USD) Gold/Steel Telescopic Front Forks -->
  <g transform="rotate(24 550 180)">
    <rect x="548" y="160" width="14" height="150" rx="4" fill="#334E68"/>
    <rect x="550" y="230" width="10" height="80" fill="#CBD5E1"/>
    <rect x="544" y="306" width="22" height="26" rx="4" fill="#102A43"/>
  </g>

  <!-- Space Grotesk Specification Typography -->
  <text x="320" y="370" fill="#334E68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">MANUAL CHAIN / 150</text>
</svg>
