<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="scooterBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#193654"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="scooterAlloy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486581"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
  </defs>

  <!-- Technical Ground Shadow -->
  <ellipse cx="400" cy="390" rx="320" ry="16" fill="#102A43" fill-opacity="0.08"/>

  <!-- Rear Wheel & Tire Assembly (14 inch modern scooter profile) -->
  <g id="rearWheel">
    <circle cx="240" cy="310" r="76" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="240" cy="310" r="54" fill="#0F172A"/>
    <!-- Alloy Rim Spokes -->
    <circle cx="240" cy="310" r="44" fill="none" stroke="url(#scooterAlloy)" stroke-width="8"/>
    <line x1="240" y1="266" x2="240" y2="354" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="196" y1="310" x2="284" y2="310" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="209" y1="279" x2="271" y2="341" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="209" y1="341" x2="271" y2="279" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <!-- Center Hub & Brake Disc -->
    <circle cx="240" cy="310" r="22" fill="#334E68"/>
    <circle cx="240" cy="310" r="8" fill="#F7F5EF"/>
  </g>

  <!-- Front Wheel & Tire Assembly -->
  <g id="frontWheel">
    <circle cx="580" cy="310" r="76" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="580" cy="310" r="54" fill="#0F172A"/>
    <!-- Alloy Rim Spokes -->
    <circle cx="580" cy="310" r="44" fill="none" stroke="url(#scooterAlloy)" stroke-width="8"/>
    <line x1="580" y1="266" x2="580" y2="354" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="536" y1="310" x2="624" y2="310" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="549" y1="279" x2="611" y2="341" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <line x1="549" y1="341" x2="611" y2="279" stroke="url(#scooterAlloy)" stroke-width="6"/>
    <!-- Front Disc Rotor with Electric Cyan Brake Caliper -->
    <circle cx="580" cy="310" r="32" fill="none" stroke="#627D98" stroke-width="4" stroke-dasharray="6 4"/>
    <rect x="596" y="292" width="18" height="24" rx="4" fill="#00A6A6"/>
    <circle cx="580" cy="310" r="16" fill="#334E68"/>
    <circle cx="580" cy="310" r="6" fill="#F7F5EF"/>
  </g>

  <!-- Mechanical Drive: CVT Gearbox Case & Air Filter Housing -->
  <path d="M240 310 L350 286 L370 316 L310 334 L240 326 Z" fill="#243B53" stroke="#334E68" stroke-width="2"/>
  <rect x="260" y="254" width="70" height="26" rx="6" fill="#102A43" stroke="#334E68" stroke-width="2"/>
  <text x="272" y="271" fill="#627D98" font-family="sans-serif" font-size="9" font-weight="700">CVT BELT</text>

  <!-- Rear Exhaust Silencer Canister -->
  <path d="M260 300 L370 290 L390 314 L270 328 Z" fill="#334E68" stroke="#102A43" stroke-width="3"/>
  <ellipse cx="380" cy="302" rx="10" ry="14" fill="#627D98"/>
  <circle cx="380" cy="302" r="5" fill="#102A43"/>

  <!-- Rear Monoshock Damper Coil -->
  <g transform="rotate(-25 316 230)">
    <rect x="306" y="220" width="14" height="60" rx="4" fill="#102A43"/>
    <line x1="304" y1="230" x2="322" y2="230" stroke="#00A6A6" stroke-width="4"/>
    <line x1="304" y1="240" x2="322" y2="240" stroke="#00A6A6" stroke-width="4"/>
    <line x1="304" y1="250" x2="322" y2="250" stroke="#00A6A6" stroke-width="4"/>
    <line x1="304" y1="260" x2="322" y2="260" stroke="#00A6A6" stroke-width="4"/>
  </g>

  <!-- Main Bodywork Shell (Modern Sharp Scoopy/Vario/NMAX Aerodynamic Architecture) -->
  <!-- Underbody & Floorboard Platform -->
  <path d="M360 330 L470 330 L500 280 L440 280 L350 290 Z" fill="#102A43"/>
  <rect x="380" y="320" width="90" height="10" rx="3" fill="#334E68"/>

  <!-- Rear Quarter Panel / Tail Subframe -->
  <path d="M220 220 L310 196 L380 230 L350 286 L250 270 Z" fill="url(#scooterBody)" stroke="#334E68" stroke-width="2"/>
  
  <!-- Sleek Contoured Two-Up Rider Saddle -->
  <path d="M224 216 C250 210, 310 210, 340 226 C370 242, 420 244, 430 250 L420 264 L330 240 L230 230 Z" 
        fill="#0F172A" stroke="#334E68" stroke-width="2"/>
  <path d="M230 216 C260 212, 310 212, 336 226" fill="none" stroke="#00A6A6" stroke-width="2"/>

  <!-- Front Leg Shield & Radiator/Fairing Cowl -->
  <path d="M430 250 L490 190 L550 170 L584 220 L530 310 L480 310 L460 270 Z" 
        fill="url(#scooterBody)" stroke="#334E68" stroke-width="2"/>

  <!-- Electric Cyan Aerodynamic Character Crease -->
  <path d="M494 210 L546 200 L562 230" fill="none" stroke="#00A6A6" stroke-width="3" stroke-linecap="round"/>

  <!-- Front Headlamp Visor & Aerodynamic Beak -->
  <path d="M550 170 L604 186 L580 230 L556 226 Z" fill="#102A43"/>
  <polygon points="586,192 602,198 584,216" fill="#00A6A6"/>

  <!-- Handlebar Column & Cockpit Screen -->
  <path d="M530 180 L516 116 L540 114 L554 174 Z" fill="#243B53"/>
  <!-- Handlebar Grips & Digital Cockpit Instrument Display -->
  <rect x="490" y="110" width="64" height="12" rx="4" fill="#0F172A"/>
  <polygon points="522,110 538,88 554,110" fill="#00A6A6" fill-opacity="0.8"/>
  <circle cx="510" cy="116" r="6" fill="#334E68"/>

  <!-- Front Telescopic Hydraulic Suspension Fork -->
  <g transform="rotate(22 550 200)">
    <rect x="546" y="190" width="12" height="130" rx="4" fill="#334E68"/>
    <rect x="548" y="250" width="8" height="70" fill="#CBD5E1"/>
    <rect x="542" y="316" width="18" height="24" rx="4" fill="#102A43"/>
  </g>

  <!-- Sleek Rear Grab Bar / Luggage Rack Tail -->
  <path d="M196 216 L230 216 L220 226 Z" fill="#00A6A6"/>
  <!-- Rear LED Taillight Node -->
  <polygon points="200,218 190,224 204,228" fill="#DC2626"/>

  <!-- Subtle Model Badge in Space Grotesk Style -->
  <text x="320" y="370" fill="#334E68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">AUTOMATIC CVT / 160</text>
</svg>
