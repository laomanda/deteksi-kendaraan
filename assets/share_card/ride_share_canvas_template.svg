<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162E44"/>
      <stop offset="50%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#091827"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Solid Canvas Background (Midnight Navy) -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#canvasBg)"/>

  <!-- Subtle Cockpit Telemetry Background Grid -->
  <g stroke="#334E68" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 16">
    <line x1="80" y1="0" x2="80" y2="1920"/>
    <line x1="1000" y1="0" x2="1000" y2="1920"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="1400" x2="1080" y2="1400"/>
  </g>

  <!-- TOP HEADER BAR: RideCare Brand Identity -->
  <g transform="translate(80, 100)">
    <!-- Small Brand Emblem -->
    <path d="M40 0 L72 12 C72 44 58 68 40 82 C22 68 8 44 8 12 Z" fill="#00A6A6" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M40 24 L52 46 L46 46 L40 34 L34 46 L28 46 Z" fill="#FFFFFF"/>
    
    <text x="96" y="44" fill="#F7F5EF" font-family="monospace" font-size="34" font-weight="800" letter-spacing="3">
      RIDECARE
    </text>
    <text x="96" y="74" fill="#627D98" font-family="sans-serif" font-size="18" font-weight="600" letter-spacing="1">
      PERSONAL VEHICLE COMPANION
    </text>

    <!-- Verified Journey Tag -->
    <rect x="740" y="20" width="180" height="48" rx="24" fill="#16A34A" fill-opacity="0.2" stroke="#16A34A" stroke-width="2"/>
    <circle cx="766" cy="44" r="8" fill="#16A34A"/>
    <text x="836" y="52" fill="#F7F5EF" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      TERVERIFIKASI
    </text>
  </g>

  <!-- CENTRAL MAP & ROUTE STAGE (Simulated GPS Polyline Canvas Area) -->
  <g transform="translate(80, 240)">
    <!-- Map Container Frame -->
    <rect x="0" y="0" width="920" height="1060" rx="36" fill="#0B1B2B" stroke="#334E68" stroke-width="3"/>
    
    <!-- Subtle Topological Map Watermark Lines -->
    <path d="M80 300 C240 200, 400 400, 600 240 C750 120, 840 300, 840 500" fill="none" stroke="#1E3851" stroke-width="4" stroke-opacity="0.4"/>
    <path d="M80 600 C240 500, 400 700, 600 540 C750 420, 840 600, 840 800" fill="none" stroke="#1E3851" stroke-width="4" stroke-opacity="0.4"/>

    <!-- Hero Glowing GPS Polyline Trajectory -->
    <path d="M160 840 C280 840, 320 620, 460 640 C600 660, 640 340, 760 260" 
          fill="none" stroke="#00A6A6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
    <path d="M160 840 C280 840, 320 620, 460 640 C600 660, 640 340, 760 260" 
          fill="none" stroke="url(#cardGlow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Start Waypoint -->
    <circle cx="160" cy="840" r="18" fill="#16A34A" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Finish Waypoint -->
    <circle cx="760" cy="260" r="18" fill="#DC2626" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Vehicle Badge Floating Card -->
    <g transform="translate(48, 48)">
      <rect x="0" y="0" width="340" height="88" rx="20" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <circle cx="48" cy="44" r="24" fill="#00A6A6"/>
      <!-- Small Bike Silhouette inside circle -->
      <path d="M36 46 L44 40 L54 40 L60 46" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <circle cx="40" cy="48" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="56" cy="48" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="88" y="38" fill="#F7F5EF" font-family="sans-serif" font-size="20" font-weight="700">Honda Vario 160</text>
      <text x="88" y="64" fill="#00A6A6" font-family="monospace" font-size="14" font-weight="700">B 4120 KZA</text>
    </g>
  </g>

  <!-- BOTTOM COCKPIT TELEMETRY METRIC CLUSTER -->
  <g transform="translate(80, 1350)">
    <!-- Metric 1: Total Distance (Hero Number in Space Grotesk) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="440" height="220" rx="28" fill="#0B1B2B" stroke="#334E68" stroke-width="2"/>
      <text x="44" y="56" fill="#627D98" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">TOTAL JARAK</text>
      <text x="44" y="136" fill="#F7F5EF" font-family="monospace" font-size="64" font-weight="800">42.8</text>
      <text x="210" y="136" fill="#00A6A6" font-family="monospace" font-size="28" font-weight="700">KM</text>
      <rect x="44" y="164" width="352" height="6" rx="3" fill="#1E3851"/>
      <rect x="44" y="164" width="280" height="6" rx="3" fill="#00A6A6"/>
    </g>

    <!-- Metric 2: Duration -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="440" height="220" rx="28" fill="#0B1B2B" stroke="#334E68" stroke-width="2"/>
      <text x="44" y="56" fill="#627D98" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">WAKTU TEMPUH</text>
      <text x="44" y="136" fill="#F7F5EF" font-family="monospace" font-size="64" font-weight="800">1j 14m</text>
      <text x="44" y="180" fill="#16A34A" font-family="sans-serif" font-size="18" font-weight="600">Perjalanan Lancar</text>
    </g>

    <!-- Sub-Metrics Row: Kecepatan Rata-rata & Status Kendaraan -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="920" height="110" rx="24" fill="#102A43" stroke="#334E68" stroke-width="2"/>
      <text x="48" y="66" fill="#627D98" font-family="sans-serif" font-size="18" font-weight="600">Kecepatan Rata-rata:</text>
      <text x="260" y="66" fill="#F7F5EF" font-family="monospace" font-size="24" font-weight="700">34.6 km/jam</text>

      <line x1="480" y1="20" x2="480" y2="90" stroke="#334E68" stroke-width="2"/>

      <text x="520" y="66" fill="#627D98" font-family="sans-serif" font-size="18" font-weight="600">Kesehatan Motor:</text>
      <text x="700" y="66" fill="#16A34A" font-family="monospace" font-size="24" font-weight="700">100% PRIMA</text>
    </g>
  </g>

  <!-- FOOTER STORYTELLING WATERMARK -->
  <text x="540" y="1830" fill="#334E68" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3">
    DICATAT OLEH RIDECARE COMPANION
  </text>
</svg>
