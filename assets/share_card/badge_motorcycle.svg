<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Squircle Badge Base -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="#EFF6FF"/>

  <!-- Minimal Motorcycle Silhouette -->
  <g transform="translate(4, 3)">
    <!-- Wheels -->
    <circle cx="16" cy="35" r="7" stroke="#1E293B" stroke-width="3" fill="none"/>
    <circle cx="16" cy="35" r="2" fill="#2563EB"/>
    <circle cx="40" cy="35" r="7" stroke="#1E293B" stroke-width="3" fill="none"/>
    <circle cx="40" cy="35" r="2" fill="#2563EB"/>

    <!-- Chassis & Frame -->
    <path d="M 16 35 L 25 25 L 34 25 L 40 35" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Tank & Seat -->
    <path d="M 23 25 C 23 22 28 22 30 24 L 37 25 C 38 27 37 29 34 29 L 24 29 Z" fill="#2563EB"/>
    <!-- Handlebars -->
    <path d="M 33 24 L 36 19 L 34 18" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Verified Health Companion Dot (Top Right) -->
  <circle cx="48" cy="16" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 46 16 L 47.5 17.5 L 50.5 14.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
