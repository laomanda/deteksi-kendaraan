<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sportBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E3851"/>
      <stop offset="60%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1926"/>
    </linearGradient>
    <linearGradient id="sportAlloy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486581"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
    <linearGradient id="sportShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A6A6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Technical Ground Shadow -->
  <ellipse cx="400" cy="390" rx="320" ry="16" fill="#102A43" fill-opacity="0.08"/>

  <!-- Rear Wheel (17 inch Lightweight Supersport Rim) -->
  <g id="rearSportWheel">
    <circle cx="230" cy="300" r="82" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="230" cy="300" r="60" fill="#0F172A"/>
    <!-- 6-Spoke Y-Alloy Design -->
    <circle cx="230" cy="300" r="48" fill="none" stroke="#334E68" stroke-width="7"/>
    <line x1="230" y1="248" x2="230" y2="352" stroke="#486581" stroke-width="5"/>
    <line x1="185" y1="274" x2="275" y2="326" stroke="#486581" stroke-width="5"/>
    <line x1="185" y1="326" x2="275" y2="274" stroke="#486581" stroke-width="5"/>
    <!-- Lightweight Rear Sprocket & Cyan Chain -->
    <circle cx="230" cy="300" r="26" fill="#334E68" stroke="#00A6A6" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="230" cy="300" r="9" fill="#F7F5EF"/>
  </g>

  <!-- Front Wheel (17 inch Supersport Rim with Dual Floating Petal Discs) -->
  <g id="frontSportWheel">
    <circle cx="590" cy="300" r="82" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="590" cy="300" r="60" fill="#0F172A"/>
    <circle cx="590" cy="300" r="48" fill="none" stroke="#334E68" stroke-width="7"/>
    <line x1="590" y1="248" x2="590" y2="352" stroke="#486581" stroke-width="5"/>
    <line x1="545" y1="274" x2="635" y2="326" stroke="#486581" stroke-width="5"/>
    <line x1="545" y1="326" x2="635" y2="274" stroke="#486581" stroke-width="5"/>
    <!-- Dual Large 320mm Drilled Floating Brake Discs -->
    <circle cx="590" cy="300" r="42" fill="none" stroke="#627D98" stroke-width="5" stroke-dasharray="8 4"/>
    <circle cx="590" cy="300" r="30" fill="none" stroke="#334E68" stroke-width="2"/>
    <!-- Radial Mount Monobloc Cyan Brake Caliper -->
    <rect x="608" y="272" width="22" height="32" rx="5" fill="#00A6A6" stroke="#102A43" stroke-width="1.5"/>
    <circle cx="590" cy="300" r="9" fill="#F7F5EF"/>
  </g>

  <!-- Aluminum Double-Sided Swingarm & Enclosed Chain Guide -->
  <path d="M230 300 L370 286 L396 308 L230 318 Z" fill="#243B53" stroke="#334E68" stroke-width="2"/>
  <line x1="230" y1="284" x2="370" y2="276" stroke="#00A6A6" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Compact MotoGP Style Underbelly Exhaust Canister -->
  <path d="M420 300 L490 330 L460 348 L380 348 L360 326 Z" fill="#1E293B" stroke="#102A43" stroke-width="2"/>
  <polygon points="460,332 486,330 478,344 456,344" fill="#334E68"/>
  <circle cx="482" cy="336" r="4" fill="#0F172A"/>

  <!-- High-Rigidity Aluminum Twin-Spar Perimeter Frame -->
  <path d="M370 200 L430 220 L480 200 L530 170 L510 160 L420 180 Z" fill="#334E68" stroke="#102A43" stroke-width="2"/>
  <line x1="390" y1="196" x2="470" y2="210" stroke="#00A6A6" stroke-width="2.5"/>

  <!-- Full Aerodynamic Side Fairing Shell (Supersport Fully Enclosed Cowling) -->
  <path d="M370 210 L450 210 L520 180 L590 180 L620 230 L550 320 L440 336 L380 290 Z" 
        fill="url(#sportBody)" stroke="#334E68" stroke-width="2"/>

  <!-- Fairing Aerodynamic Heat Extractor Vents / Slits (Shark Gills) -->
  <g stroke="#00A6A6" stroke-width="3" stroke-linecap="round">
    <line x1="470" y1="240" x2="496" y2="270"/>
    <line x1="486" y1="240" x2="512" y2="270"/>
    <line x1="502" y1="240" x2="528" y2="270"/>
  </g>

  <!-- Aerodynamic Downforce Winglet (Front Fairing Flank) -->
  <polygon points="560,226 610,234 596,244 554,236" fill="#00A6A6" stroke="#102A43" stroke-width="1.5"/>

  <!-- Muscular Racing Fuel Tank with Ergonomic Knee Pockets -->
  <path d="M370 206 C390 136 460 132 506 166 L524 200 L430 216 Z" 
        fill="url(#sportBody)" stroke="#334E68" stroke-width="2"/>
  <!-- Tank High-Grip Protection Center Pad -->
  <path d="M400 166 C434 156 470 160 490 178" fill="none" stroke="#00A6A6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Aggressive Supersport Front Nose Cowl & Ram-Air Intake Snout -->
  <path d="M530 166 L620 174 L636 210 L586 216 Z" fill="#102A43" stroke="#334E68" stroke-width="2"/>
  <!-- Sharp Dual LED Projector Headlamp -->
  <polygon points="600,186 630,192 616,206 596,200" fill="#00A6A6"/>
  <line x1="602" y1="188" x2="628" y2="194" stroke="#F7F5EF" stroke-width="2" stroke-linecap="round"/>

  <!-- Aerodynamic Racing Bubble Smoked Windscreen -->
  <path d="M524 162 C544 110, 584 116, 610 174 Z" fill="url(#sportShield)" stroke="#00A6A6" stroke-width="2"/>

  <!-- Low Racing Clip-On Handlebars (Positioned Below Triple Clamp) -->
  <line x1="520" y1="154" x2="540" y2="168" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="516" cy="150" r="5" fill="#00A6A6"/>
  <!-- Bar-End Aerodynamic Lever Guard -->
  <path d="M514 148 L506 154 L514 162" fill="none" stroke="#00A6A6" stroke-width="2"/>

  <!-- High-Rake Inverted (USD) Front Suspension Forks -->
  <g transform="rotate(23 550 170)">
    <rect x="548" y="150" width="14" height="160" rx="4" fill="#334E68"/>
    <rect x="550" y="220" width="10" height="90" fill="#CBD5E1"/>
    <rect x="544" y="306" width="22" height="26" rx="4" fill="#102A43"/>
  </g>

  <!-- Sharp Upswept Racing Solo Tail Cowl (Aerodynamic Tunnels) -->
  <path d="M190 170 L280 184 L310 210 L370 210 L350 226 L260 216 Z" 
        fill="#0F172A" stroke="#334E68" stroke-width="2"/>
  <!-- Solo Seat Removable Racing Cowl Top -->
  <polygon points="196,170 270,178 256,196 204,192" fill="#00A6A6"/>
  <!-- Compact Ultra-Bright LED Taillight -->
  <polygon points="190,170 180,176 192,180" fill="#DC2626"/>

  <!-- Racing Specification Monospace Typography -->
  <text x="320" y="370" fill="#334E68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">SUPERSPORT RACING / 250</text>
</svg>
