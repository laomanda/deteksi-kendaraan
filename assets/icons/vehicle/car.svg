<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1E3851"/>
      <stop offset="60%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1926"/>
    </linearGradient>
    <linearGradient id="carGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334E68" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="carRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627D98"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
  </defs>

  <!-- Technical Ground Shadow -->
  <ellipse cx="400" cy="380" rx="360" ry="18" fill="#102A43" fill-opacity="0.10"/>

  <!-- Rear Wheel & Tire Assembly (Car Profile) -->
  <g id="carRearWheel">
    <circle cx="210" cy="320" r="64" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="210" cy="320" r="46" fill="#0F172A"/>
    <!-- Alloy Turbine Multi-Spoke Rim -->
    <circle cx="210" cy="320" r="38" fill="none" stroke="url(#carRimGrad)" stroke-width="6"/>
    <line x1="210" y1="280" x2="210" y2="360" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="170" y1="320" x2="250" y2="320" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="182" y1="292" x2="238" y2="348" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="182" y1="348" x2="238" y2="292" stroke="url(#carRimGrad)" stroke-width="5"/>
    <!-- Center Hub Cap & Cyan Caliper Accent -->
    <rect x="220" y="304" width="16" height="22" rx="3" fill="#00A6A6"/>
    <circle cx="210" cy="320" r="14" fill="#334E68"/>
    <circle cx="210" cy="320" r="5" fill="#F7F5EF"/>
  </g>

  <!-- Front Wheel & Tire Assembly (Car Profile) -->
  <g id="carFrontWheel">
    <circle cx="590" cy="320" r="64" fill="#1A202C" stroke="#334E68" stroke-width="4"/>
    <circle cx="590" cy="320" r="46" fill="#0F172A"/>
    <!-- Alloy Turbine Multi-Spoke Rim -->
    <circle cx="590" cy="320" r="38" fill="none" stroke="url(#carRimGrad)" stroke-width="6"/>
    <line x1="590" y1="280" x2="590" y2="360" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="550" y1="320" x2="630" y2="320" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="562" y1="292" x2="618" y2="348" stroke="url(#carRimGrad)" stroke-width="5"/>
    <line x1="562" y1="348" x2="618" y2="292" stroke="url(#carRimGrad)" stroke-width="5"/>
    <!-- Front Ventilated Rotor & Cyan Caliper -->
    <rect x="600" y="304" width="16" height="22" rx="3" fill="#00A6A6"/>
    <circle cx="590" cy="320" r="14" fill="#334E68"/>
    <circle cx="590" cy="320" r="5" fill="#F7F5EF"/>
  </g>

  <!-- Aerodynamic Modern Vehicle Body Shell -->
  <!-- Underbody Rocker Panel & Side Skirt -->
  <path d="M280 340 L520 340 L530 326 L270 326 Z" fill="#0F172A"/>
  <rect x="286" y="332" width="228" height="4" fill="#00A6A6"/>

  <!-- Main Monocoque Body Profile (A-Pillar to D-Pillar Fastback / Crossover) -->
  <path d="M70 300 C90 280, 130 260, 160 260 
           L240 260 C260 210, 310 160, 360 150 
           L500 150 C540 150, 580 180, 610 220 
           L690 240 C720 250, 740 280, 730 310 
           L710 334 L660 334 
           C650 280, 530 280, 520 334 
           L280 334 
           C270 280, 150 280, 140 334 
           L90 334 Z" 
        fill="url(#carBodyGrad)" stroke="#334E68" stroke-width="3"/>

  <!-- Greenhouse Glasshouse Architecture (Tinted Windows) -->
  <path d="M260 250 L340 170 L480 170 L580 230 L590 250 Z" 
        fill="url(#carGlassGrad)" stroke="#334E68" stroke-width="2"/>

  <!-- B-Pillar & C-Pillar Dividers -->
  <line x1="410" y1="170" x2="410" y2="250" stroke="#102A43" stroke-width="8"/>
  <line x1="490" y1="170" x2="504" y2="250" stroke="#102A43" stroke-width="8"/>

  <!-- Flush Aerodynamic Door Handles -->
  <rect x="360" y="260" width="32" height="6" rx="3" fill="#334E68" stroke="#102A43" stroke-width="1"/>
  <rect x="460" y="260" width="32" height="6" rx="3" fill="#334E68" stroke="#102A43" stroke-width="1"/>

  <!-- Front Headlamp Cluster: Electric Cyan LED Signature Lightbar -->
  <path d="M680 248 L724 260 L710 274 L660 270 Z" fill="#00A6A6"/>
  <line x1="680" y1="248" x2="724" y2="260" stroke="#F7F5EF" stroke-width="3" stroke-linecap="round"/>

  <!-- Rear LED Horizon Taillight Strip (Solid Red Safety) -->
  <path d="M80 292 L120 284 L110 302 L76 304 Z" fill="#DC2626"/>

  <!-- Side Mirror Winglet with Integrated Repeater Indicator -->
  <path d="M560 234 L534 226 L530 238 Z" fill="#102A43" stroke="#334E68" stroke-width="2"/>
  <line x1="532" y1="232" x2="546" y2="236" stroke="#00A6A6" stroke-width="2"/>

  <!-- Precise Shoulder Line / Character Crease (High Tension) -->
  <path d="M120 284 L270 274 L520 270 L680 254" fill="none" stroke="#334E68" stroke-width="2"/>
  <path d="M130 286 L270 276 L520 272 L680 256" fill="none" stroke="#F7F5EF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Rear Roofline Aerodynamic Spoiler -->
  <path d="M220 178 L266 170 L260 182 Z" fill="#00A6A6"/>

  <!-- Technical Spec Watermark in Space Grotesk -->
  <text x="320" y="370" fill="#334E68" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">CAR PASSENGER / HYBRID</text>
</svg>
