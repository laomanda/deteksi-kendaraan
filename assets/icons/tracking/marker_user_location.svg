<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A6A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00A6A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(0.75)">
    <!-- Outer Pulsing Radar Wave Area -->
    <circle cx="32" cy="32" r="28" fill="url(#pulseGlow)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#00A6A6" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- High-Contrast Outer White Ring -->
    <circle cx="32" cy="32" r="16" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>

    <!-- Core Electric Cyan Vehicle Navigation Beacon -->
    <circle cx="32" cy="32" r="12" fill="#00A6A6"/>

    <!-- Directional Heading Arrow (Facing Upwards 0 deg) -->
    <polygon points="32,24 38,36 32,33 26,36" fill="#FFFFFF"/>
  </g>
</svg>
