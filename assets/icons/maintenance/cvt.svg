<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Pulley Back Flange Depth Layer (Asymmetric CVT Ratio Layout) -->
  <circle cx="14" cy="24" r="8.5" fill="#0B192C" stroke="#243B53" stroke-width="1"/>
  <circle cx="33" cy="24" r="12" fill="#0B192C" stroke="#243B53" stroke-width="1"/>

  <!-- Tapered Automotive CVT V-Belt (Continuous Heavy-Duty Rubber Band) -->
  <path d="M12.4 15.6 L30.8 12.2 C38 10.8 45 16.5 45 24 C45 31.5 38 37.2 30.8 35.8 L12.4 32.4 C6.5 31.2 3 27.8 3 24 C3 20.2 6.5 16.8 12.4 15.6 Z" 
        fill="#102A43" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Inner Tapered V-Belt Cavity -->
  <path d="M13.2 18.6 L31.4 15.4 C36.2 14.5 40.5 18.5 40.5 24 C40.5 29.5 36.2 33.5 31.4 32.6 L13.2 29.4 C9 28.5 6.5 26.5 6.5 24 C6.5 21.5 9 19.5 13.2 18.6 Z" 
        fill="#0B192C"/>

  <!-- Inner V-Belt Cogged Teeth (Precision Mechanical Dashes) -->
  <path d="M13.5 18.6 L31.5 15.4 M13.5 29.4 L31.5 32.6" 
        fill="none" stroke="#243B53" stroke-width="2.2" stroke-dasharray="1.8 2.2" stroke-linecap="butt"/>

  <!-- Electric Cyan Telemetry Tension Spine -->
  <path d="M12.4 15.6 L30.8 12.2 C36.5 11.2 42.5 15.5 44.5 20.5" 
        fill="none" stroke="#00A6A6" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="12.4" cy="15.6" r="0.75" fill="#00E5FF"/>

  <!-- Primary Drive Variator Pulley (Left Front Sheave) -->
  <circle cx="14" cy="24" r="7.5" fill="#243B53" stroke="#334E68" stroke-width="1.2"/>
  <circle cx="14" cy="24" r="5" fill="#102A43"/>

  <!-- Variator Conical Sheave Bevel Arc -->
  <path d="M9.5 21 C11.5 19.5 16.5 19.5 18.5 21" fill="none" stroke="#486581" stroke-width="0.8"/>

  <!-- Variator Roller Weight Cams (Neutral Mechanical Steel) -->
  <circle cx="14" cy="21" r="1.1" fill="#627D98" stroke="#334E68" stroke-width="0.5"/>
  <circle cx="16.5" cy="25.5" r="1.1" fill="#627D98" stroke="#334E68" stroke-width="0.5"/>
  <circle cx="11.5" cy="25.5" r="1.1" fill="#627D98" stroke="#334E68" stroke-width="0.5"/>

  <!-- Crankshaft Center Spline Nut & Pivot -->
  <circle cx="14" cy="24" r="1.8" fill="#486581" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="14" cy="24" r="0.6" fill="#FFFFFF"/>

  <!-- Secondary Driven Pulley (Rear Clutch Sheave) -->
  <circle cx="33" cy="24" r="10.8" fill="#243B53" stroke="#334E68" stroke-width="1.3"/>
  <circle cx="33" cy="24" r="8" fill="#102A43" stroke="#334E68" stroke-width="1"/>

  <!-- Clutch Bell Inspection & Cooling Ports (3 Radial Vents) -->
  <circle cx="33" cy="19.2" r="1" fill="#0B192C"/>
  <circle cx="37.2" cy="26.2" r="1" fill="#0B192C"/>
  <circle cx="28.8" cy="26.2" r="1" fill="#0B192C"/>

  <!-- Concentric Torque Spring Step Ring -->
  <circle cx="33" cy="24" r="4.8" fill="none" stroke="#486581" stroke-width="0.9"/>

  <!-- Transmission Axle Center Boss -->
  <circle cx="33" cy="24" r="2.2" fill="#486581" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="33" cy="24" r="0.8" fill="#627D98"/>
</svg>
