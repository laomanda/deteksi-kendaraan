<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="gearOilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B53"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.4)">
    <!-- Technical Ambient Ground Shadow -->
    <ellipse cx="60" cy="106" rx="38" ry="6" fill="#102A43" fill-opacity="0.12"/>

    <!-- Elongated Gear Oil Tube Bottle (120ml Scooter Transmission Tube) -->
    <!-- Conical Precision Dispenser Spout / Nozzle -->
    <polygon points="56,12 64,12 66,32 54,32" fill="#00A6A6" stroke="#102A43" stroke-width="1.5"/>
    <rect x="54" y="28" width="12" height="6" rx="2" fill="#102A43"/>
    <line x1="60" y1="12" x2="60" y2="28" stroke="#F7F5EF" stroke-width="1"/>

    <!-- Bottle Shoulder & Cylindrical Tube Body -->
    <path d="M46 44 L54 32 L66 32 L74 44 L76 96 C76 100, 72 104, 60 104 C48 104, 44 100, 44 96 Z" 
          fill="url(#gearOilBody)" stroke="#334E68" stroke-width="2" stroke-linejoin="round"/>

    <!-- Tube Pinch Tail Crimped Seam -->
    <path d="M44 96 L76 96 L74 102 L46 102 Z" fill="#334E68"/>

    <!-- Front Identification Label -->
    <rect x="48" y="50" width="24" height="38" rx="3" fill="#1E3851" stroke="#334E68" stroke-width="1"/>

    <!-- Interlocking Twin Transmission Gear Teeth Silhouette -->
    <g transform="translate(60, 66)">
      <!-- Main Gear -->
      <circle cx="-3" cy="0" r="8" fill="none" stroke="#00A6A6" stroke-width="3" stroke-dasharray="3 3"/>
      <circle cx="-3" cy="0" r="3" fill="#00A6A6"/>
      <!-- Secondary Pinion Gear -->
      <circle cx="5" cy="-5" r="5" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2"/>
      <circle cx="5" cy="-5" r="1.5" fill="#F59E0B"/>
    </g>

    <!-- Technical Spec Label in Space Grotesk -->
    <text x="60" y="82" fill="#F7F5EF" font-family="monospace" font-size="5.5" font-weight="700" text-anchor="middle">GEAR OIL</text>
    <text x="60" y="87" fill="#00A6A6" font-family="monospace" font-size="4.5" font-weight="700" text-anchor="middle">80W-90</text>
  </g>
</svg>
