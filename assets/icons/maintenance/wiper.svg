<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ============================================================== -->
  <!-- 1. UPPER METAL WIPER ARM & PIVOT HINGE                         -->
  <!-- ============================================================== -->
  <!-- Wiper Arm Steel Shaft -->
  <path d="M 14 8 L 23 20 L 21 21.5 L 12 9.5 Z"
        fill="#243B53" stroke="#334E68" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- Arm Structural Ridge Line -->
  <line x1="13.5" y1="9" x2="22" y2="20.5" stroke="#486581" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Arm Pivot Rivet Joint -->
  <circle cx="13.5" cy="9" r="2" fill="#102A43" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="13.5" cy="9" r="0.8" fill="#BAC7D5"/>

  <!-- ============================================================== -->
  <!-- 2. MECHANICAL MOUNTING CONNECTOR & LOCKING CLIP (Center Joint) -->
  <!-- ============================================================== -->
  <g transform="rotate(-28 24 22)">
    <!-- Connector Housing Box -->
    <rect x="20" y="18" width="8" height="7.5" rx="1.5"
          fill="#102A43" stroke="#334E68" stroke-width="1"/>

    <!-- Inner Latch Cavity -->
    <rect x="21.5" y="19.5" width="5" height="4.5" rx="0.8"
          fill="#081420" stroke="#243B53" stroke-width="0.6"/>

    <!-- Pivot Pin Hinge -->
    <circle cx="24" cy="21.8" r="1.2" fill="#BAC7D5"/>
    <circle cx="24" cy="21.8" r="0.5" fill="#102A43"/>

    <!-- Quick-Release Lock Tab (Cyan Accent) -->
    <rect x="25.5" y="20.8" width="1.8" height="1.8" rx="0.4" fill="#00A6A6"/>
  </g>

  <!-- ============================================================== -->
  <!-- 3. AERODYNAMIC WIPER BLADE SUPPORT FRAME (Spine Backbone)      -->
  <!-- ============================================================== -->
  <!-- Main Composite Spoiler Frame -->
  <path d="M 7 37
           C 16 25, 28 16, 40 9
           L 41 11
           C 29 18, 17 27, 8.5 39 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- Stainless Steel Flexor Spine Rail -->
  <path d="M 9 36.5 C 18 25.5, 29 17, 39 10.5"
        fill="none" stroke="#BAC7D5" stroke-width="0.8" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 4. NATURAL RUBBER SQUEEGEE BLADE (Clear Blade Geometry)        -->
  <!-- ============================================================== -->
  <!-- Dual-Beveled Rubber Blade Body -->
  <path d="M 8 39
           C 17 28.5, 28 20, 38 13.5
           L 39 14.5
           C 29 21, 18 29.5, 9 40 Z"
        fill="#081420" stroke="#102A43" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Active Silicone Wiper Edge (Cyan Highlight Line) -->
  <path d="M 7 40.5 C 17 29.5, 28 21, 39 14"
        fill="none" stroke="#00A6A6" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 5. BLADE END RETAINER CAPS                                      -->
  <!-- ============================================================== -->
  <!-- Lower-Left End Cap -->
  <rect x="6" y="38" width="2.5" height="2.5" rx="0.6"
        transform="rotate(-28 7.2 39.2)"
        fill="#243B53" stroke="#334E68" stroke-width="0.6"/>

  <!-- Upper-Right End Cap -->
  <rect x="39" y="10" width="2.5" height="2.5" rx="0.6"
        transform="rotate(-28 40.2 11.2)"
        fill="#243B53" stroke="#334E68" stroke-width="0.6"/>
  <circle cx="40.2" cy="11.2" r="0.4" fill="#00E5FF"/>
</svg>
