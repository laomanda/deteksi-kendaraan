<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Proportional Threaded Filler Cap (Top-Left) -->
  <rect x="16" y="9" width="8" height="4" rx="1.2" fill="#243B53" stroke="#334E68" stroke-width="1.1"/>
  <line x1="18.5" y1="10" x2="18.5" y2="12" stroke="#486581" stroke-width="0.9"/>
  <line x1="21.5" y1="10" x2="21.5" y2="12" stroke="#486581" stroke-width="0.9"/>

  <!-- Bottle Neck Collar -->
  <rect x="17.2" y="12.5" width="5.6" height="3" fill="#102A43" stroke="#334E68" stroke-width="1"/>

  <!-- Main Engine Oil Container Housing (Dark Navy Automotive Reservoir) -->
  <path d="M14.5 15.5 H23 C27.5 15.5 32 18.2 34.5 22 V38.5 C34.5 40.5 33 42 31 42 H14.5 C12.5 42 11 40.5 11 38.5 V21.5 C11 18 12.5 15.5 14.5 15.5 Z" 
        fill="#102A43" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Top Shoulder Telemetry Accent Line -->
  <path d="M23 15.5 C27 15.5 31 18 33.5 21.8" 
        fill="none" stroke="#00A6A6" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="33.5" cy="21.8" r="0.75" fill="#00E5FF"/>

  <!-- Left Transparent Oil Level Inspection Column -->
  <rect x="13.2" y="21" width="3" height="17" rx="1.5" fill="#0B192C" stroke="#243B53" stroke-width="0.8"/>
  <rect x="13.7" y="26" width="2" height="11.5" rx="1" fill="#00A6A6"/>

  <!-- Calibrated Level Tick Marks -->
  <line x1="12.2" y1="24" x2="14.5" y2="24" stroke="#F8FAFC" stroke-width="1" stroke-linecap="round"/>
  <line x1="12.2" y1="29.5" x2="14.5" y2="29.5" stroke="#F8FAFC" stroke-width="1" stroke-linecap="round"/>
  <line x1="12.2" y1="35" x2="14.5" y2="35" stroke="#F8FAFC" stroke-width="1" stroke-linecap="round"/>

  <!-- Right Ergonomic Casing Ribs -->
  <line x1="32" y1="26" x2="34" y2="26" stroke="#334E68" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="34" y2="30" stroke="#334E68" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="34" y2="34" stroke="#334E68" stroke-width="1" stroke-linecap="round"/>

  <!-- Center-Right Technical Recessed Display Plate -->
  <rect x="18.5" y="20" width="13.5" height="18.5" rx="2" fill="#0B192C" stroke="#243B53" stroke-width="1"/>

  <!-- Minimalist Lubrication Oil Drop Technical Emblem -->
  <path d="M25.2 23 C25.2 23, 28.2 27, 28.2 29 C28.2 30.8 26.8 32.2 25.2 32.2 C23.6 32.2 22.2 30.8 22.2 29 C22.2 27, 25.2 23, 25.2 23 Z" 
        fill="#102A43" stroke="#00A6A6" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Oil Drop Specular Node -->
  <circle cx="24.5" cy="29" r="0.8" fill="#00E5FF"/>

  <!-- Engine Lubrication Film Wave Arc (Subtle Lubricant Cue) -->
  <path d="M21 34.5 C23 35.5 27.5 35.5 29.5 34.5" 
        fill="none" stroke="#00A6A6" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Viscosity Telemetry Metric Bar -->
  <rect x="22.5" y="36.5" width="5.5" height="1" rx="0.5" fill="#334E68"/>
</svg>
