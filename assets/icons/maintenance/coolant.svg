<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Overflow Radiator-to-Reservoir Coolant Hose -->
  <path d="M17.5 9.8 C21 5.8, 25.5 5.8, 28.5 9.2" fill="none" stroke="#243B53" stroke-width="2" stroke-linecap="round"/>

  <!-- Radiator Heat Exchanger Aluminum Core (Background Left) -->
  <rect x="7" y="12" width="15" height="26" rx="2" fill="#1E293B" stroke="#334E68" stroke-width="1.3"/>
  
  <!-- Radiator Vertical Cooling Fins / Micro-Channels -->
  <line x1="10.5" y1="15" x2="10.5" y2="23" stroke="#334E68" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="14.5" y1="15" x2="14.5" y2="23" stroke="#334E68" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18.5" y1="15" x2="18.5" y2="35" stroke="#334E68" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Radiator High-Pressure Spring Cap (Top-Left) -->
  <rect x="8.5" y="8" width="12" height="4" rx="1.2" fill="#486581" stroke="#334E68" stroke-width="1"/>
  <rect x="13" y="6.5" width="3" height="1.8" rx="0.5" fill="#627D98"/>

  <!-- Main Coolant Expansion Reservoir Tank Housing (Foreground Hero Object) -->
  <path d="M23 15 C23 13.5 24.2 12.5 25.5 12.5 H37.5 C38.8 12.5 40 13.5 40 15 V35.5 C40 37.5 38.5 39 36.5 39 H26.5 C24.5 39 23 37.5 23 35.5 Z" 
        fill="#102A43" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Reservoir Pressure Cap (Top-Right) -->
  <rect x="27.5" y="8" width="10.5" height="4.5" rx="1.4" fill="#243B53" stroke="#334E68" stroke-width="1.2"/>
  <line x1="31" y1="9.2" x2="31" y2="11.5" stroke="#486581" stroke-width="1"/>
  <line x1="34.5" y1="9.2" x2="34.5" y2="11.5" stroke="#486581" stroke-width="1"/>

  <!-- Recessed Translucent Fluid Chamber Window -->
  <rect x="25.5" y="16" width="13" height="19" rx="2" fill="#0B192C" stroke="#243B53" stroke-width="1"/>

  <!-- Active Coolant Fluid Level (Proportional Reservoir Fill in Electric Cyan) -->
  <path d="M26.5 24.5 C28.5 24, 31.5 25, 33.5 24.5 C35.5 24, 37 24.5, 37.5 24.3 V33.5 C37.5 34.5 36.8 35 36 35 H28 C27.2 35 26.5 34.5 26.5 33.5 Z" 
        fill="#00A6A6"/>

  <!-- Meniscus Fluid Surface Neon Highlight -->
  <path d="M26.8 24.5 C28.8 24, 31.5 25, 33.5 24.5 C35.5 24, 37 24.5, 37.2 24.3" 
        fill="none" stroke="#00E5FF" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Calibrated Fluid Level Notches (MIN / MAX Indicators) -->
  <line x1="24.2" y1="20" x2="27" y2="20" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24.2" y1="29.5" x2="27" y2="29.5" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Automotive Coolant Temperature Sensor (ECT Probe & Telemetry Transducer) -->
  <!-- Sensor Upper Housing & Connector -->
  <rect x="12" y="23" width="3" height="4" rx="0.5" fill="#243B53" stroke="#334E68" stroke-width="0.8"/>
  <!-- Threaded Sensor Mounting Hex Nut -->
  <rect x="10.5" y="27" width="6" height="3" rx="0.6" fill="#486581" stroke="#334E68" stroke-width="0.9"/>
  <!-- Sensor Thermal Probe Stem Immersed in Core -->
  <rect x="12" y="30" width="3" height="5" rx="1.2" fill="#102A43" stroke="#00A6A6" stroke-width="1"/>
  <!-- Telemetry Signal Core & Pulse Ticks -->
  <circle cx="13.5" cy="32.5" r="0.9" fill="#00E5FF"/>
  <line x1="9.2" y1="32.5" x2="10.8" y2="32.5" stroke="#00A6A6" stroke-width="1" stroke-linecap="round"/>
  <line x1="16.2" y1="32.5" x2="17.8" y2="32.5" stroke="#00A6A6" stroke-width="1" stroke-linecap="round"/>
</svg>
