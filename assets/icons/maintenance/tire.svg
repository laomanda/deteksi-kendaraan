<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 3D Toroidal Tire Crown & Tread Hull (Dark Navy Rubber Band) -->
  <path d="M19 8 L27 8 C33.5 8 39 15.2 39 24 C39 32.8 33.5 40 27 40 L19 40 C12.5 40 7 32.8 7 24 C7 15.2 12.5 8 19 8 Z" 
        fill="#102A43" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Circumferential Aquaplaning Rain Channel (Electric Cyan Telemetry Line) -->
  <path d="M23 8 C30 8 35 15.2 35 24 C35 32.8 30 40 23 40" 
        fill="none" stroke="#00A6A6" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="35" cy="24" r="0.75" fill="#00E5FF"/>

  <!-- Transverse Directional Tread Sipes (Cross-Tread Traction Grooves) -->
  <line x1="20" y1="10" x2="26" y2="9.5" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="23" y1="13.5" x2="30" y2="13" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="27" y1="18" x2="35" y2="17.5" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="29.5" y1="23" x2="37.5" y2="23" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="27" y1="29.5" x2="35" y2="30" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="23" y1="34.5" x2="30" y2="35" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="20" y1="38" x2="26" y2="38.5" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Front Facing Sidewall Disk (Left Perspective Profile) -->
  <ellipse cx="19" cy="24" rx="12" ry="16" fill="#1E293B" stroke="#243B53" stroke-width="1.2"/>

  <!-- Alloy Wheel Rim Cavity -->
  <ellipse cx="19" cy="24" rx="8.5" ry="11.5" fill="#0B192C" stroke="#334E68" stroke-width="1.2"/>

  <!-- Wheel Spokes (Clean Alloy Wheel Pattern) -->
  <line x1="19" y1="18.8" x2="19" y2="12.5" stroke="#334E68" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="29.2" x2="19" y2="35.5" stroke="#334E68" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="15.2" y1="24" x2="10.5" y2="24" stroke="#334E68" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22.2" y1="20.5" x2="25.5" y2="16.5" stroke="#334E68" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22.2" y1="27.5" x2="25.5" y2="31.5" stroke="#334E68" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Center Wheel Hub & Axle Nut -->
  <ellipse cx="19" cy="24" rx="3.8" ry="5.2" fill="#243B53" stroke="#334E68" stroke-width="1"/>
  <ellipse cx="19" cy="24" rx="1.8" ry="2.4" fill="#486581"/>

  <!-- Wheel Stud Lug Nuts -->
  <circle cx="16.8" cy="22" r="0.6" fill="#627D98"/>
  <circle cx="21.2" cy="22" r="0.6" fill="#627D98"/>
  <circle cx="16.8" cy="26" r="0.6" fill="#627D98"/>
  <circle cx="21.2" cy="26" r="0.6" fill="#627D98"/>

  <!-- Tire Inflation Air Valve Stem -->
  <line x1="23.5" y1="18" x2="25.5" y2="16.5" stroke="#486581" stroke-width="1.3" stroke-linecap="round"/>
</svg>
