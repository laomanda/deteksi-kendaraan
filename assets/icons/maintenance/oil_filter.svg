<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE GROUND SHADOW                                  -->
  <!-- ============================================================== -->
  <ellipse cx="48" cy="84" rx="28" ry="7" fill="#102A43" fill-opacity="0.18"/>

  <!-- ============================================================== -->
  <!-- 2. CYLINDRICAL STEEL CANISTER BODY                             -->
  <!-- ============================================================== -->
  <!-- Main Cylindrical Canister Barrel -->
  <path d="M 22 34
           L 22 70
           C 22 78, 34 83, 48 83
           C 62 83, 74 78, 74 70
           L 74 34 Z"
        fill="#102A43" stroke="#334E68" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Cylindrical Metallic Specular Highlight Band -->
  <path d="M 32 34 L 32 80 C 36 81.5, 40 82.2, 44 82.5 L 44 34 Z"
        fill="#1E3851" opacity="0.8"/>
  <line x1="34" y1="35" x2="34" y2="79" stroke="#BAC7D5" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Canister Wrench Grip Flutes (Vertical Fluted Ridges) -->
  <line x1="27" y1="46" x2="27" y2="66" stroke="#243B53" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="40" y2="70" stroke="#243B53" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="48" x2="56" y2="70" stroke="#243B53" stroke-width="2" stroke-linecap="round"/>
  <line x1="69" y1="46" x2="69" y2="66" stroke="#243B53" stroke-width="2" stroke-linecap="round"/>

  <!-- Lower Rolled-Steel Crimp Seam Flange -->
  <path d="M 20 69 C 20 77, 32 82, 48 82 C 64 82, 76 77, 76 69"
        fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 3. TOP MOUNTING BASE PLATE & RUBBER SEALING GASKET             -->
  <!-- ============================================================== -->
  <!-- Top Base Plate Outer Steel Bezel -->
  <ellipse cx="48" cy="34" rx="26" ry="14"
           fill="#243B53" stroke="#334E68" stroke-width="2.2"/>

  <!-- Rubber Sealing O-Ring Gasket Channel -->
  <ellipse cx="48" cy="34" rx="21" ry="11"
           fill="#0B192C" stroke="#102A43" stroke-width="1.8"/>

  <!-- Active Gasket Compression Lip (Cyan Technical Highlight) -->
  <ellipse cx="48" cy="34" rx="19" ry="9.5"
           fill="none" stroke="#00A6A6" stroke-width="2"/>

  <!-- Inner Recessed Mounting Basin -->
  <ellipse cx="48" cy="34" rx="14" ry="7"
           fill="#102A43" stroke="#243B53" stroke-width="1.5"/>

  <!-- ============================================================== -->
  <!-- 4. PERIMETER OIL INLET PORTS & CENTER THREADED MOUNTING NIPPLE -->
  <!-- ============================================================== -->
  <!-- 6 Circular Oil Circulation Inlet Holes -->
  <circle cx="37" cy="31.5" r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="43" cy="29"   r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="53" cy="29"   r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="59" cy="31.5" r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="56" cy="37"   r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="40" cy="37"   r="1.8" fill="#081420" stroke="#334E68" stroke-width="0.8"/>

  <!-- Raised Center Threaded Mounting Hub Spindle -->
  <ellipse cx="48" cy="33.5" rx="5.5" ry="3.2"
           fill="#081420" stroke="#334E68" stroke-width="1.2"/>

  <!-- Thread Grooves inside Center Bore -->
  <ellipse cx="48" cy="33.5" rx="3.5" ry="1.8"
           fill="none" stroke="#BAC7D5" stroke-width="1.2"/>
  <circle cx="48" cy="33.5" r="1" fill="#00E5FF"/>

  <!-- ============================================================== -->
  <!-- 5. TECHNICAL SPEC IDENTIFIER BAND                              -->
  <!-- ============================================================== -->
  <line x1="42" y1="56" x2="54" y2="56" stroke="#00A6A6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="48" cy="56" r="1.5" fill="#00E5FF"/>
</svg>
