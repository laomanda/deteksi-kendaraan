<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE SHADOW                                         -->
  <!-- ============================================================== -->
  <ellipse cx="48" cy="89" rx="20" ry="4.5" fill="#102A43" fill-opacity="0.14"/>

  <!-- ============================================================== -->
  <!-- 2. BOTTOM FUEL INLET SPIGOT & HOSE BARB FITTING                -->
  <!-- ============================================================== -->
  <!-- Lower Fuel Delivery Tube -->
  <rect x="44" y="66" width="8" height="20" rx="1.5"
        fill="#243B53" stroke="#334E68" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Lower Quick-Connect Latch Collar (Cyan Accent) -->
  <rect x="42.5" y="70" width="11" height="3" rx="1"
        fill="#102A43" stroke="#00A6A6" stroke-width="1.4"/>

  <!-- Dual Hose Retention Barb Ribs -->
  <path d="M 42 77 L 54 77 L 52.5 79.5 L 43.5 79.5 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 42 82 L 54 82 L 52.5 84.5 L 43.5 84.5 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1" stroke-linejoin="round"/>

  <!-- Bottom Raw Fuel Inlet Port -->
  <ellipse cx="48" cy="86" rx="4" ry="1.8"
           fill="#081420" stroke="#243B53" stroke-width="1.2"/>

  <!-- ============================================================== -->
  <!-- 3. LOWER CONICAL DOME TRANSITION & CRIMP FLANGE                -->
  <!-- ============================================================== -->
  <!-- Bottom Tapered Cone -->
  <path d="M 30 60
           C 30 64, 42 66, 44 68
           L 52 68
           C 54 66, 66 64, 66 60 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Bottom Rolled-Steel Seam Crimp -->
  <ellipse cx="48" cy="60" rx="18" ry="4"
           fill="#243B53" stroke="#334E68" stroke-width="1.6"/>

  <!-- ============================================================== -->
  <!-- 4. MAIN CYLINDRICAL CANISTER BODY & CHASSIS BRACKET            -->
  <!-- ============================================================== -->
  <!-- Main Canister Chamber Shell -->
  <path d="M 30 36
           L 30 60
           C 30 64, 66 64, 66 60
           L 66 36 Z"
        fill="#102A43" stroke="#334E68" stroke-width="2" stroke-linejoin="round"/>

  <!-- Specular Reflection Highlight Facet -->
  <path d="M 37 36 L 37 61 C 41 62, 47 62, 51 61 L 51 36 Z"
        fill="#1E3851" opacity="0.85"/>
  <line x1="40" y1="37" x2="40" y2="60" stroke="#BAC7D5" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>

  <!-- Side Chassis Mounting Ear & Eyelet -->
  <path d="M 28 45 L 19 45 C 17 45, 17 51, 19 51 L 28 51 Z"
        fill="#1E3851" stroke="#334E68" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="21.5" cy="48" r="1.6" fill="#081420" stroke="#334E68" stroke-width="0.8"/>

  <!-- Center Steel Clamping Bracket Band -->
  <rect x="28" y="45" width="40" height="6" rx="1.2"
        fill="#243B53" stroke="#334E68" stroke-width="1.5"/>

  <!-- Technical Flow Direction / Spec Indicator Mark -->
  <rect x="44.5" y="47" width="7" height="2" rx="1" fill="#00A6A6"/>

  <!-- ============================================================== -->
  <!-- 5. UPPER CONICAL DOME TRANSITION & CRIMP FLANGE                -->
  <!-- ============================================================== -->
  <!-- Top Rolled-Steel Seam Crimp -->
  <ellipse cx="48" cy="36" rx="18" ry="4"
           fill="#243B53" stroke="#334E68" stroke-width="1.6"/>

  <!-- Top Tapered Cone Dome -->
  <path d="M 30 36
           C 30 29, 42 27, 44 25
           L 52 25
           C 54 27, 66 29, 66 36 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- ============================================================== -->
  <!-- 6. TOP FUEL OUTLET SPIGOT & HOSE BARB FITTING                  -->
  <!-- ============================================================== -->
  <!-- Upper Fuel Delivery Tube -->
  <rect x="44" y="10" width="8" height="17" rx="1.5"
        fill="#243B53" stroke="#334E68" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Upper Quick-Connect Latch Collar (Cyan Accent) -->
  <rect x="42.5" y="23" width="11" height="3" rx="1"
        fill="#102A43" stroke="#00A6A6" stroke-width="1.4"/>

  <!-- Dual Hose Retention Barb Ribs -->
  <path d="M 42 15 L 54 15 L 52.5 17.5 L 43.5 17.5 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 42 20 L 54 20 L 52.5 22.5 L 43.5 22.5 Z"
        fill="#102A43" stroke="#334E68" stroke-width="1" stroke-linejoin="round"/>

  <!-- Top Clean Fuel Outlet Port Orifice (Cyan Bezel) -->
  <ellipse cx="48" cy="10" rx="4" ry="1.8"
           fill="#081420" stroke="#00A6A6" stroke-width="1.4"/>
</svg>
