<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Refined 30-Degree Angled Spark Plug Assembly -->
  <g transform="rotate(-30 24 24)">
    <!-- Terminal Stud Nut (Top) -->
    <rect x="22" y="3.5" width="4" height="4.5" rx="1" fill="#627D98" stroke="#334E68" stroke-width="0.9"/>

    <!-- Ceramic Insulator Body (White High-Alumina) -->
    <rect x="21" y="8" width="6" height="11" rx="1.5" fill="#F8FAFC" stroke="#334E68" stroke-width="1"/>

    <!-- 3 Anti-Flashover Ribs -->
    <rect x="20" y="10" width="8" height="1.6" rx="0.8" fill="#E2E8F0" stroke="#334E68" stroke-width="0.7"/>
    <rect x="20" y="12.8" width="8" height="1.6" rx="0.8" fill="#E2E8F0" stroke="#334E68" stroke-width="0.7"/>
    <rect x="20" y="15.6" width="8" height="1.6" rx="0.8" fill="#E2E8F0" stroke="#334E68" stroke-width="0.7"/>

    <!-- Metal Hex Nut Shell (For Socket Wrench) -->
    <path d="M19 19 H29 L30.5 25 H17.5 Z" fill="#243B53" stroke="#334E68" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="24" y1="19" x2="24" y2="25" stroke="#486581" stroke-width="1"/>

    <!-- Gasket Sealing Crush Washer -->
    <rect x="18" y="25" width="12" height="2" rx="0.6" fill="#486581" stroke="#334E68" stroke-width="0.8"/>

    <!-- Threaded Metal Cylinder Body -->
    <rect x="20" y="27" width="8" height="10" fill="#102A43" stroke="#334E68" stroke-width="1.1"/>

    <!-- 2 Bold, Clean Precision Thread Ridges (Small-Size Optimized) -->
    <line x1="19" y1="30" x2="29" y2="30" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="19" y1="34" x2="29" y2="34" stroke="#334E68" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Center Electrode (Fine-Wire Core) -->
    <rect x="22.8" y="37" width="2.4" height="3" fill="#94A3B8"/>

    <!-- Curved Ground Electrode with Spark Gap -->
    <path d="M20 37 V42.5 H25.5" fill="none" stroke="#627D98" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Subtle High-Energy Electric Spark Discharge Pulse -->
    <path d="M23.5 40.5 L24.5 39.5 L23.8 41.5 L25 40.5" 
          fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24.2" cy="40.5" r="0.75" fill="#00A6A6"/>
    <circle cx="24.2" cy="40.5" r="0.3" fill="#FFFFFF"/>
  </g>
</svg>
