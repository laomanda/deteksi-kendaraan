<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- ============================================================== -->
  <!-- 1. AMBIENT BASE GROUND SHADOW                                  -->
  <!-- ============================================================== -->
  <circle cx="48" cy="49" r="41" fill="#102A43" fill-opacity="0.16"/>

  <!-- ============================================================== -->
  <!-- 2. LAYER 1: OUTER SEGMENTED CLUTCH FRICTION DISC FACINGS       -->
  <!-- ============================================================== -->
  <!-- Outer Friction Ring Body -->
  <circle cx="48" cy="48" r="40" fill="#102A43" stroke="#334E68" stroke-width="2.5"/>

  <!-- Stepped Friction Pad Recess -->
  <circle cx="48" cy="48" r="31" fill="#1E3851" stroke="#243B53" stroke-width="1.8"/>

  <!-- 8 Radial Friction Expansion Grooves (Segmented Lining) -->
  <g stroke="#091826" stroke-width="2.2" stroke-linecap="round">
    <line x1="48" y1="8"  x2="48" y2="17"/>
    <line x1="48" y1="79" x2="48" y2="88"/>
    <line x1="8"  y1="48" x2="17" y2="48"/>
    <line x1="79" y1="48" x2="88" y2="48"/>
    <line x1="19.7" y1="19.7" x2="26.1" y2="26.1"/>
    <line x1="69.9" y1="69.9" x2="76.3" y2="76.3"/>
    <line x1="76.3" y1="19.7" x2="69.9" y2="26.1"/>
    <line x1="26.1" y1="69.9" x2="19.7" y2="76.3"/>
  </g>

  <!-- Friction Edge Cyan Technical Highlight -->
  <path d="M 52 9 A 39 39 0 0 1 76 19" fill="none" stroke="#00A6A6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 87 52 A 39 39 0 0 1 77 76" fill="none" stroke="#00A6A6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- 3. LAYER 2: STEEL CARRIER & PRESSURE PLATE ASSEMBLY            -->
  <!-- ============================================================== -->
  <!-- Steel Carrier Disc Plate -->
  <circle cx="48" cy="48" r="27" fill="#243B53" stroke="#334E68" stroke-width="2"/>

  <!-- Concentric Diaphragm Spring Recess Step -->
  <circle cx="48" cy="48" r="23" fill="#182E44" stroke="#243B53" stroke-width="1.2"/>

  <!-- Diaphragm Spring Radial Slits -->
  <g stroke="#0E1C2B" stroke-width="1.4">
    <line x1="48" y1="19" x2="48" y2="25"/>
    <line x1="48" y1="71" x2="48" y2="77"/>
    <line x1="19" y1="48" x2="25" y2="48"/>
    <line x1="71" y1="48" x2="77" y2="48"/>
    <line x1="27.5" y1="27.5" x2="31.8" y2="31.8"/>
    <line x1="64.2" y1="64.2" x2="68.5" y2="68.5"/>
    <line x1="68.5" y1="27.5" x2="64.2" y2="31.8"/>
    <line x1="31.8" y1="64.2" x2="27.5" y2="68.5"/>
  </g>

  <!-- Assembly Retaining Rivets (Steel Fasteners) -->
  <circle cx="48" cy="20.5" r="1.4" fill="#BAC7D5"/>
  <circle cx="48" cy="75.5" r="1.4" fill="#BAC7D5"/>
  <circle cx="20.5" cy="48" r="1.4" fill="#BAC7D5"/>
  <circle cx="75.5" cy="48" r="1.4" fill="#BAC7D5"/>

  <circle cx="28.5" cy="28.5" r="1.4" fill="#BAC7D5"/>
  <circle cx="67.5" cy="67.5" r="1.4" fill="#BAC7D5"/>
  <circle cx="67.5" cy="28.5" r="1.4" fill="#BAC7D5"/>
  <circle cx="28.5" cy="67.5" r="1.4" fill="#BAC7D5"/>

  <!-- ============================================================== -->
  <!-- 4. LAYER 3: 4 TORSION DAMPER SPRINGS (Helical Damper Coils)    -->
  <!-- ============================================================== -->
  <!-- Top Spring Window (12 o'clock) -->
  <g id="springWindowTop">
    <rect x="41" y="27" width="14" height="8" rx="2.5" fill="#081420" stroke="#334E68" stroke-width="1.2"/>
    <rect x="42.5" y="28" width="3" height="6" rx="1" fill="#BAC7D5"/>
    <rect x="46.5" y="28" width="3" height="6" rx="1" fill="#486581"/>
    <rect x="50.5" y="28" width="3" height="6" rx="1" fill="#BAC7D5"/>
  </g>

  <!-- Bottom Spring Window (6 o'clock) -->
  <g id="springWindowBottom">
    <rect x="41" y="61" width="14" height="8" rx="2.5" fill="#081420" stroke="#334E68" stroke-width="1.2"/>
    <rect x="42.5" y="62" width="3" height="6" rx="1" fill="#BAC7D5"/>
    <rect x="46.5" y="62" width="3" height="6" rx="1" fill="#486581"/>
    <rect x="50.5" y="62" width="3" height="6" rx="1" fill="#BAC7D5"/>
  </g>

  <!-- Left Spring Window (9 o'clock) -->
  <g id="springWindowLeft">
    <rect x="27" y="41" width="8" height="14" rx="2.5" fill="#081420" stroke="#334E68" stroke-width="1.2"/>
    <rect x="28" y="42.5" width="6" height="3" rx="1" fill="#BAC7D5"/>
    <rect x="28" y="46.5" width="6" height="3" rx="1" fill="#486581"/>
    <rect x="28" y="50.5" width="6" height="3" rx="1" fill="#BAC7D5"/>
  </g>

  <!-- Right Spring Window (3 o'clock) -->
  <g id="springWindowRight">
    <rect x="61" y="41" width="8" height="14" rx="2.5" fill="#081420" stroke="#334E68" stroke-width="1.2"/>
    <rect x="62" y="42.5" width="6" height="3" rx="1" fill="#BAC7D5"/>
    <rect x="62" y="46.5" width="6" height="3" rx="1" fill="#486581"/>
    <rect x="62" y="50.5" width="6" height="3" rx="1" fill="#BAC7D5"/>
  </g>

  <!-- ============================================================== -->
  <!-- 5. LAYER 4: CENTER SPLINED DRIVE HUB (Shaft Flange)            -->
  <!-- ============================================================== -->
  <!-- Splined Hub Collar -->
  <circle cx="48" cy="48" r="14" fill="#102A43" stroke="#334E68" stroke-width="1.8"/>

  <!-- Inner Recessed Step Ring -->
  <circle cx="48" cy="48" r="10.5" fill="#1E3851" stroke="#243B53" stroke-width="1"/>

  <!-- Splined Transmission Input Shaft Bore -->
  <circle cx="48" cy="48" r="7" fill="#081420" stroke="#334E68" stroke-width="1.2"/>

  <!-- Internal Transmission Spline Teeth -->
  <g fill="#BAC7D5">
    <rect x="47" y="41.5" width="2" height="2" rx="0.5"/>
    <rect x="47" y="52.5" width="2" height="2" rx="0.5"/>
    <rect x="41.5" y="47" width="2" height="2" rx="0.5"/>
    <rect x="52.5" y="47" width="2" height="2" rx="0.5"/>
  </g>

  <!-- Center Pinpoint (Electric Cyan) -->
  <circle cx="48" cy="48" r="2" fill="#00E5FF"/>
  <circle cx="48" cy="48" r="0.8" fill="#FFFFFF"/>
</svg>
