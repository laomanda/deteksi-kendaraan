<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Negative Terminal (-) Post (Left - Steel Blue) -->
  <rect x="9" y="7" width="8" height="6" rx="1.5" fill="#486581" stroke="#334E68" stroke-width="1.2"/>
  <rect x="10.5" y="5.5" width="5" height="2" rx="0.8" fill="#627D98"/>
  <!-- Minus Sign Path -->
  <path d="M11.5 10 H14.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Positive Terminal (+) Post (Right - Steel Blue with Crimson Base) -->
  <rect x="31" y="7" width="8" height="6" rx="1.5" fill="#DC2626" stroke="#991B1B" stroke-width="1.2"/>
  <rect x="32.5" y="5.5" width="5" height="2" rx="0.8" fill="#EF4444"/>
  <!-- Plus Sign Path -->
  <path d="M33.5 10 H36.5 M35 8.5 V11.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Lid / Cover Casing -->
  <path d="M6 13 C6 11.8954 6.89543 11 8 11 H40 C41.1046 11 42 11.8954 42 13 V17 H6 V13 Z" fill="#243B53" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cell Vent Strip (Center Lid) -->
  <rect x="18.5" y="13" width="11" height="2.5" rx="1" fill="#102A43" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="21" cy="14.25" r="0.6" fill="#486581"/>
  <circle cx="24" cy="14.25" r="0.6" fill="#486581"/>
  <circle cx="27" cy="14.25" r="0.6" fill="#486581"/>

  <!-- Main Battery Housing Body (Dark Navy) -->
  <path d="M7 17 H41 V39 C41 40.6569 39.6569 42 38 42 H10 C8.34315 42 7 40.6569 7 39 V17 Z" fill="#102A43" stroke="#334E68" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Structural Casing Ribs (Vertical Grooves) -->
  <rect x="10" y="21" width="1.5" height="17" rx="0.75" fill="#1E3A56"/>
  <rect x="36.5" y="21" width="1.5" height="17" rx="0.75" fill="#1E3A56"/>

  <!-- Central Telemetry Display Plate -->
  <rect x="14" y="20" width="20" height="18" rx="2" fill="#0B192C" stroke="#334E68" stroke-width="1.2"/>

  <!-- Electric Cyan Energy Pulse / Lightning Bolt -->
  <path d="M24.5 23 L21 28.5 H24 L22.5 34 L27.5 28 H24.5 L26 23 Z" fill="#00A6A6" stroke="#00E5FF" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- State of Charge Optical Indicator ("Magic Eye") -->
  <circle cx="17.5" cy="32.5" r="2.2" fill="#102A43" stroke="#334E68" stroke-width="0.8"/>
  <circle cx="17.5" cy="32.5" r="1.2" fill="#10B981"/>

  <!-- Telemetry Charge Level Indicators -->
  <rect x="29" y="30" width="3" height="1.2" rx="0.6" fill="#00A6A6"/>
  <rect x="29" y="32" width="3" height="1.2" rx="0.6" fill="#00A6A6"/>
  <rect x="29" y="34" width="3" height="1.2" rx="0.6" fill="#334E68"/>

  <!-- Retractable Flush Carrying Handle Contour -->
  <path d="M12 17 C12 15.2 36 15.2 36 17" fill="none" stroke="#486581" stroke-width="1.2" stroke-linecap="round"/>
</svg>
