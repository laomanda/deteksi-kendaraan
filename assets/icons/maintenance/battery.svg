<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="batCasing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3851"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.4)">
    <ellipse cx="60" cy="106" rx="46" ry="8" fill="#102A43" fill-opacity="0.12"/>

    <!-- Battery Main Heavy-Duty Polypropylene Box Body -->
    <path d="M22 46 L98 46 L92 98 L28 98 Z" fill="url(#batCasing)" stroke="#334E68" stroke-width="2" stroke-linejoin="round"/>

    <!-- Reinforced Battery Top Cover Lid -->
    <path d="M18 40 L102 40 L98 48 L22 48 Z" fill="#243B53" stroke="#334E68" stroke-width="2"/>

    <!-- Negative (-) Terminal Post (Steel / Left) -->
    <rect x="28" y="28" width="14" height="12" rx="2" fill="#627D98" stroke="#102A43" stroke-width="1.5"/>
    <rect x="30" y="24" width="10" height="4" rx="1" fill="#334E68"/>
    <rect x="32" y="33" width="6" height="2" fill="#F7F5EF"/>

    <!-- Positive (+) Terminal Post (Brass / Red / Right) -->
    <rect x="78" y="28" width="14" height="12" rx="2" fill="#DC2626" stroke="#102A43" stroke-width="1.5"/>
    <rect x="80" y="24" width="10" height="4" rx="1" fill="#991B1B"/>
    <line x1="85" y1="31" x2="85" y2="37" stroke="#F7F5EF" stroke-width="2"/>
    <line x1="82" y1="34" x2="88" y2="34" stroke="#F7F5EF" stroke-width="2"/>

    <!-- Built-In Retractable Carry Handle -->
    <path d="M38 38 C38 20, 82 20, 82 38" fill="none" stroke="#00A6A6" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Identification & Telemetry Label -->
    <rect x="32" y="56" width="56" height="34" rx="4" fill="#0D1F33" stroke="#334E68" stroke-width="1"/>

    <!-- State of Charge Optical Indicator ("Magic Eye") -->
    <circle cx="44" cy="73" r="6" fill="#102A43" stroke="#334E68" stroke-width="1.5"/>
    <circle cx="44" cy="73" r="3" fill="#16A34A"/> <!-- Solid Green = Fully Charged -->

    <text x="64" y="69" fill="#00A6A6" font-family="monospace" font-size="8" font-weight="700">12V / 6Ah</text>
    <text x="64" y="79" fill="#F7F5EF" font-family="sans-serif" font-size="6" font-weight="600">AGM GEL</text>
  </g>
</svg>
