<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="120" y1="360" x2="390" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="healthPulse" x1="180" y1="200" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with Calm Tech Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgGrad)" filter="url(#subtleShadow)"/>

  <!-- Subtle Inner Border for High-Resolution Polish -->
  <rect x="37" y="37" width="438" height="438" rx="107" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Background Journey Grid Elements (Calm Technology) -->
  <circle cx="256" cy="256" r="160" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="110" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Dynamic Journey Path (Route Tracking) -->
  <path d="M 108 376 C 160 376 180 320 256 320 C 330 320 350 376 404 376" 
        stroke="url(#routeGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Route Start & End Minimal Nodes -->
  <circle cx="108" cy="376" r="10" fill="#14B8A6" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="404" cy="376" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Central Vehicle Body Silhouette (Modern Automotive Minimalism) -->
  <!-- Sleek Aerodynamic Roof & Cabin -->
  <path d="M 160 270 
           C 172 232 204 204 246 200 
           L 300 200 
           C 334 204 354 228 368 270 
           Z" 
        fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Cabin Window Inset -->
  <path d="M 190 262 
           C 198 238 220 220 250 218 
           L 292 218 
           C 316 220 330 238 338 262 
           Z" 
        fill="#2563EB" fill-opacity="0.88"/>

  <!-- Window Divider Pillar -->
  <rect x="254" y="218" width="8" height="44" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Vehicle Main Beltline & Lower Body -->
  <path d="M 132 270 
           C 132 258 142 248 154 248 
           L 374 248 
           C 386 248 396 258 396 270 
           L 396 292 
           C 396 298 390 304 384 304 
           L 144 304 
           C 138 304 132 298 132 292 
           Z" 
        fill="#FFFFFF"/>

  <!-- Minimalist Flush Headlight & Taillight -->
  <rect x="382" y="260" width="10" height="12" rx="3" fill="#60A5FA"/>
  <rect x="136" y="260" width="8" height="12" rx="2" fill="#F87171"/>

  <!-- Minimalist Aerodynamic Wheels -->
  <circle cx="186" cy="304" r="28" fill="#1E293B"/>
  <circle cx="186" cy="304" r="16" fill="#94A3B8"/>
  <circle cx="186" cy="304" r="8" fill="#FFFFFF"/>

  <circle cx="342" cy="304" r="28" fill="#1E293B"/>
  <circle cx="342" cy="304" r="16" fill="#94A3B8"/>
  <circle cx="342" cy="304" r="8" fill="#FFFFFF"/>

  <!-- Floating Health Shield & Pulse Sensor (Health Monitoring Indicator) -->
  <g transform="translate(256, 142)">
    <!-- Protective Calm Health Shield -->
    <path d="M 0 -36 
             L 28 -22 
             C 28 8 16 32 0 42 
             C -16 32 -28 8 -28 -22 
             Z" 
          fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <!-- ECG / Health Cross Pulse -->
    <path d="M -12 2 L -4 2 L 0 -12 L 4 14 L 8 -2 L 14 -2" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
